            {/* FACTION ARMY SPECIAL RULES (COMPACT SINGLE-COLUMN LIST) */}
            {factionData?.armyRules && factionData.armyRules.length > 0 && (
              <div className="rules-print-block mt-3.5 pt-2.5 border-t border-zinc-300 break-inside-avoid">
                <h2 className="text-[11px] font-black font-tactical uppercase tracking-wider text-zinc-900 mb-1.5">
                  {factionData.faction} Army Special Rules
                </h2>
                <div className="space-y-1 text-[9.5px] font-sans text-justify" style={{ textAlign: 'justify' }}>
                  {factionData.armyRules.map((rule, idx) => (
                    <div key={idx} className="leading-snug text-zinc-800 text-justify" style={{ textAlign: 'justify' }}>
                      <strong className="font-bold text-zinc-950">{rule.name}:</strong> {rule.text}
                    </div>
                  ))}
                </div>
              </div>
            )}
            <div className="mt-5 pt-2 border-t border-zinc-300 flex items-center justify-between text-[9px] font-mono text-zinc-500">
              <span>Bolt Action v3 Army Builder • {factionData?.book}</span>
              <span>Generated on {currentDateStr}</span>
            </div>
          </div>
        );
      }
      // =========================================================================
      // EXPORT ROSTER MODAL (PDF ONLY)
      // =========================================================================
      function ExportModal({
        isOpen,
        onClose,
        factionData,
        armyListName,
        setArmyListName,
        armyNotes,
        setArmyNotes,
        totalPoints,
        totalOrderDice,
        platoons,
        onDirectPDFDownload,
        isGeneratingPdf
      }) {
        if (!isOpen) return null;
        const totalUnits = platoons.reduce((acc, p) => acc + Object.keys(p.slots).length, 0);
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-black/60 backdrop-blur-sm animate-in fade-in duration-150 no-print">
            <div className="bg-zinc-900 border border-zinc-750 rounded-2xl shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col max-h-[92vh]">
              <div className="px-5 py-3.5 bg-zinc-950 border-b border-zinc-800 flex items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-lg bg-amber-400/15 border border-amber-400/30 flex items-center justify-center text-amber-400">
                    <DownloadIcon className="w-4 h-4" />
                  </div>
                  <h2 className="text-base font-black font-tactical text-white tracking-wide uppercase">
                    Export
                  </h2>
                </div>

                <button
                  type="button"
                  onClick={onClose}
                  className="p-1.5 rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors cursor-pointer"
                >
                  <XIcon className="w-5 h-5" />
                </button>
              </div>
              <div className="flex-1 overflow-y-auto p-4 sm:p-5 space-y-4">
                <div className="bg-zinc-950/70 border border-zinc-800 rounded-xl p-3.5 space-y-3">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div className="flex-1 min-w-[240px]">
                      <label className="text-[10.5px] font-mono font-bold uppercase tracking-wider text-zinc-400 block mb-1">
                        Force Roster Name
                      </label>
                      <input
                        type="text"
                        value={armyListName}
                        onChange={(e) => setArmyListName(e.target.value)}
                        placeholder="Untitled..."
                        className="w-full bg-zinc-900 border border-zinc-750 focus:border-amber-400 rounded-lg px-3 py-1.5 text-xs text-white font-mono placeholder-zinc-600 outline-none transition-colors"
                      />
                    </div>
                    <div className="flex flex-wrap items-center gap-1.5 text-[11px] sm:text-xs font-mono shrink-0">
                      <div className="bg-zinc-900 border border-zinc-750 px-2.5 py-1 rounded-lg text-zinc-200">
                        Points: <strong className="text-amber-400">{totalPoints}</strong>
                      </div>
                      <div className="bg-zinc-900 border border-zinc-750 px-2.5 py-1 rounded-lg text-zinc-200">
                        Dice: <strong className="text-white">{totalOrderDice}</strong>
                      </div>
                      <div className="bg-zinc-900 border border-zinc-750 px-2.5 py-1 rounded-lg text-zinc-200">
                        Platoons: <strong className="text-white">{platoons.length}</strong>
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="text-[10.5px] font-mono font-bold uppercase tracking-wider text-zinc-400 block mb-1">
                      Force Notes (Optional)
                    </label>
                    <textarea
                      value={armyNotes}
                      onChange={(e) => setArmyNotes(e.target.value)}
                      rows={2}
                      placeholder="Add deployment notes or tactical reminders..."
                      className="w-full bg-zinc-900 border border-zinc-750 focus:border-amber-400 rounded-lg px-3 py-1.5 text-xs text-white font-mono placeholder-zinc-600 outline-none transition-colors resize-none"
                    />
                  </div>
                </div>

                <button
                  type="button"
                  onClick={onDirectPDFDownload}
                  disabled={totalUnits === 0 || isGeneratingPdf}
                  className="w-full py-3 px-4 rounded-xl bg-amber-400 hover:bg-amber-300 disabled:opacity-50 text-black font-black text-sm font-tactical uppercase tracking-wider flex items-center justify-center gap-2.5 transition-all shadow-md cursor-pointer"
                >
                  <DownloadIcon className="w-4 h-4" />
                  <span>{isGeneratingPdf ? "Generating PDF..." : "Download PDF"}</span>
                </button>

                <div className="space-y-2">
                  <div className="flex items-center justify-between text-xs font-mono text-zinc-400">
                    <span className="font-bold uppercase tracking-wider flex items-center gap-1.5">
                      <EyeIcon className="w-3.5 h-3.5 text-amber-400" />
                      <span>Live Roster Preview</span>
                    </span>
                  </div>
                  <div className="bg-white text-zinc-900 rounded-xl p-4 sm:p-6 border border-zinc-300 shadow-inner max-h-[46vh] overflow-y-auto">
                    <div id="printable-army-roster-preview">
                      <ArmyRosterPrintView
                        factionData={factionData}
                        armyListName={armyListName}
                        armyNotes={armyNotes}
                        totalPoints={totalPoints}
                        totalOrderDice={totalOrderDice}
                        platoons={platoons}
                        isPreview={true}
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }
      // =========================================================================
      // MAIN APPLICATION
      // =========================================================================
      // Clear any legacy draft so the app always opens completely clean and empty by default
      try { localStorage.removeItem('boltaction.draft.v1'); } catch {}

      function App() {
        const availableFactions = Object.keys(FACTIONS_REGISTRY);
        const [activeFactionId, setActiveFactionId] = useState(availableFactions[0] || 'soviet_union');
        const factionData = FACTIONS_REGISTRY[activeFactionId] || window.EASYARMY_SOVIET_DATA;
        const platoonTypes = factionData?.platoons || [];

        const [platoons, setPlatoons] = useState([
          { id: 1, typeId: 'infantry', period: 'All', slots: {} }
        ]);

        const [activePlatoonId, setActivePlatoonId] = useState(1);
        const [isPlatoonDropdownOpen, setIsPlatoonDropdownOpen] = useState(false);
        const platoonDropdownRef = useRef(null);

        const [editingUnitModal, setEditingUnitModal] = useState({
          isOpen: false,
          slotId: null,
          slotLabel: null,
          unitItem: null
        });
        const [isExportModalOpen, setIsExportModalOpen] = useState(false);
        const [armyListName, setArmyListName] = useState("");
        const [armyNotes, setArmyNotes] = useState("");
        const [toast, setToast] = useState(null);
        const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);

        // Accounts & cloud lists
        const { user } = useAuth();
        const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
        const [isMyListsOpen, setIsMyListsOpen] = useState(false);
        const [isUserMenuOpen, setIsUserMenuOpen] = useState(false);
        const [currentListId, setCurrentListId] = useState(null);
        const [isSaving, setIsSaving] = useState(false);

        const showToast = (message, type = "info") => {
          setToast({ message, type });
          setTimeout(() => setToast(null), 4000);
        };

        // Close the user menu on outside tap
        useEffect(() => {
          if (!isUserMenuOpen) return;
          const close = () => setIsUserMenuOpen(false);
          const t = setTimeout(() => document.addEventListener('click', close), 0);
          return () => {
            clearTimeout(t);
            document.removeEventListener('click', close);
          };
        }, [isUserMenuOpen]);

        const handleCloudSave = async (asNew = false) => {
          let targetName = (armyListName || 'Untitled Force').trim();
          if (asNew || !currentListId) {
            const prompted = window.prompt('List name:', targetName);
            if (prompted === null) return;
            targetName = (prompted || 'Untitled Force').trim();
            setArmyListName(targetName);
          }

          const row = {
            name: targetName,
            faction_id: activeFactionId,
            total_points: totalPoints,
            order_dice: totalOrderDice,
            data: { version: '2.0', factionId: activeFactionId, listName: targetName, notes: armyNotes, platoons },
          };

          // If signed in to Supabase Cloud, save to cloud + mirror locally
          if (user && supabaseClient) {
            setIsSaving(true);
            try {
              const isCloudUUID = currentListId && !String(currentListId).startsWith('local-');
              if (isCloudUUID && !asNew) {
                const { error } = await supabaseClient.from('army_lists').update(row).eq('id', currentListId);
                if (error) throw error;
              } else {
                const { data, error } = await supabaseClient.from('army_lists').insert(row).select('id').single();
                if (error) throw error;
                setCurrentListId(data.id);
              }
              showToast(`Saved "${row.name}" to Cloud.`, "success");
            } catch (err) {
              showToast("Cloud save failed: " + (err.message || err), "error");
            } finally {
              setIsSaving(false);
            }
            return;
          }

          // Fallback: save to local device library (works offline / without login)
          const localLists = loadLocalLists();
          const nowIso = new Date().toISOString();
          const isExistingLocal = currentListId && String(currentListId).startsWith('local-') && !asNew;
          const nextId = isExistingLocal ? currentListId : `local-${Date.now()}`;
          const localEntry = {
            id: nextId,
            ...row,
            updated_at: nowIso,
          };
          const filtered = localLists.filter((x) => x.id !== nextId);
          saveLocalLists([localEntry, ...filtered]);
          setCurrentListId(nextId);
          showToast(
            isSupabaseConfigured()
              ? `Saved "${row.name}" on this device (Sign in to sync to Cloud).`
              : `Saved "${row.name}" on this device.`,
            "success"
          );
        };

        const handleLoadCloudList = (row) => {
          const d = row.data || {};
          if (!Array.isArray(d.platoons) || d.platoons.length === 0) {
            showToast("This saved list is empty or invalid.", "error");
            return;
          }
          if (row.faction_id && FACTIONS_REGISTRY[row.faction_id]) setActiveFactionId(row.faction_id);
          setPlatoons(d.platoons);
          setActivePlatoonId(d.platoons[0].id);
          setArmyListName(row.name || d.listName || '');
          setArmyNotes(d.notes || '');
          setCurrentListId(row.id);
          showToast(`Loaded "${row.name}" (${row.total_points} pts)`, "success");
        };

        const handleNewList = () => {
          if (!window.confirm('Start a new empty list? Unsaved changes to the current list will be lost.')) return;
          setPlatoons([{ id: 1, typeId: 'infantry', period: 'All', slots: {} }]);
          setActivePlatoonId(1);
          setArmyListName('');
          setArmyNotes('');
          setCurrentListId(null);
        };

        const handleSignOut = async () => {
          await supabaseClient?.auth.signOut();
          signOutLocalUser();
          setCurrentListId(null);
          showToast("Signed out.", "success");
        };
        const currentPlatoon = useMemo(
          () => platoons.find(p => p.id === activePlatoonId) || platoons[0],
          [platoons, activePlatoonId]
        );
        const currentType = useMemo(
          () => platoonTypes.find(t => t.id === currentPlatoon.typeId) || platoonTypes[0],
          [platoonTypes, currentPlatoon.typeId]
        );

        const totalOrderDice = useMemo(
          () => platoons.reduce((acc, p) => acc + Object.keys(p.slots).length, 0),
          [platoons]
        );
        const totalPoints = useMemo(
          () => platoons.reduce((acc, p) => acc + Object.values(p.slots).reduce((sum, u) => sum + (u?.points || 0), 0), 0),
          [platoons]
        );
        const currentPlatoonPoints = useMemo(
          () => Object.values(currentPlatoon.slots).reduce((sum, u) => sum + (u?.points || 0), 0),
          [currentPlatoon.slots]
        );

        useEffect(() => {
          function handleClickOutside(event) {
            if (platoonDropdownRef.current && !platoonDropdownRef.current.contains(event.target)) {
              setIsPlatoonDropdownOpen(false);
            }
          }
          if (isPlatoonDropdownOpen) {
            document.addEventListener('mousedown', handleClickOutside);
          }
          return () => document.removeEventListener('mousedown', handleClickOutside);
        }, [isPlatoonDropdownOpen]);

        const handleSelectPlatoonType = (newTypeId) => {
          setPlatoons(platoons.map(p => {
            if (p.id === activePlatoonId) {
              return { ...p, typeId: newTypeId, slots: {} };
            }
            return p;
          }));
          setIsPlatoonDropdownOpen(false);
        };
        const handleSelectSlot = (slotId, unitName, slotLabel) => {
          const def = getUnitDefinition(factionData, unitName);
          const initialExp = def.defaultExp || "regular";
          const initialCost = def.costs[initialExp]?.points ?? 0;

          const newUnitItem = {
            name: unitName,
            points: initialCost,
            config: {
              experience: initialExp,
              extraMen: 0,
              options: {}
            }
          };

          setPlatoons(platoons.map(p => {
            if (p.id === activePlatoonId) {
              return {
                ...p,
                slots: { ...p.slots, [slotId]: newUnitItem }
              };
            }
            return p;
          }));

          setEditingUnitModal({
            isOpen: true,
            slotId,
            slotLabel,
            unitItem: newUnitItem
          });
        };

        const handleOpenEditModal = (slotId, unitItem, slotLabel) => {
          setEditingUnitModal({
            isOpen: true,
            slotId,
            slotLabel,
            unitItem
          });
        };
        const handleSaveUnitFromModal = (updatedUnit) => {
          if (!editingUnitModal.slotId) return;
          setPlatoons(platoons.map(p => {
            if (p.id === activePlatoonId) {
              return {
                ...p,
                slots: { ...p.slots, [editingUnitModal.slotId]: updatedUnit }
              };
            }
            return p;
          }));
        };

        const handleClearSlot = (slotId) => {
          setPlatoons(platoons.map(p => {
            if (p.id === activePlatoonId) {
              const nextSlots = { ...p.slots };
              delete nextSlots[slotId];
              return { ...p, slots: nextSlots };
            }
            return p;
          }));
        };
        const handleAddPlatoon = () => {
          const nextId = platoons.length > 0 ? Math.max(...platoons.map(p => p.id)) + 1 : 1;
          const newPlatoon = { id: nextId, typeId: 'infantry', period: 'All', slots: {} };
          setPlatoons([...platoons, newPlatoon]);
          setActivePlatoonId(nextId);
          setIsPlatoonDropdownOpen(true);
        };
        const handleDeletePlatoon = (e, platoonId) => {
          e.stopPropagation();
          if (platoons.length <= 1) return;
          const nextPlatoons = platoons.filter(p => p.id !== platoonId);
          setPlatoons(nextPlatoons);
          if (activePlatoonId === platoonId) {
            setActivePlatoonId(nextPlatoons[0].id);
          }
        };
        const handlePlatoonButtonClick = (platoonId) => {
          if (activePlatoonId === platoonId) {
            setIsPlatoonDropdownOpen(!isPlatoonDropdownOpen);
          } else {
            setActivePlatoonId(platoonId);
            setIsPlatoonDropdownOpen(true);
          }
        };

        const handleDirectPDFDownload = () => {
          const element = document.getElementById("printable-army-roster-preview");
          if (!element || !window.html2pdf) {
            window.print();
            return;
          }
          setIsGeneratingPdf(true);
          const cleanName = (armyListName || "BoltAction_Roster").replace(/[^a-zA-Z0-9_-]/g, "_");
          const opt = {
            margin: [8, 8, 8, 8],
            filename: `${cleanName}_${totalPoints}pts.pdf`,
            image: { type: "jpeg", quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, logging: false },
            jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
          };
          window.html2pdf().set(opt).from(element).save().then(() => {
            setIsGeneratingPdf(false);
            showToast("PDF downloaded successfully.", "success");
          }).catch(() => {
            setIsGeneratingPdf(false);
            window.print();
          });
        };

        return (
          <div className="min-h-screen bg-zinc-950 text-zinc-100 font-sans safe-top safe-x sm:px-6 antialiased pb-28 sm:pb-24">
            {toast && (
              <div className="fixed top-[max(1rem,env(safe-area-inset-top))] left-3 right-3 sm:left-auto sm:right-5 z-[60] animate-in fade-in slide-in-from-top-2 duration-150 no-print">
                <div className={`px-4 py-2.5 rounded-xl shadow-2xl border font-mono text-xs font-bold flex items-center gap-2.5 ${
                  toast.type === 'error'
                    ? 'bg-red-950/95 border-red-500 text-red-200'
                    : 'bg-emerald-950/95 border-emerald-500 text-emerald-200'
                }`}>
                  <span className={`w-2 h-2 rounded-full shrink-0 ${toast.type === 'error' ? 'bg-red-400' : 'bg-emerald-400'}`} />
                  <span>{toast.message}</span>
                </div>
              </div>
            )}

            <div className="max-w-[1400px] mx-auto space-y-2 sm:space-y-2.5 no-print">

              {/* TOP BRAND HEADER: CENTERED INSIDE A CELL */}
              <div className="flex items-center justify-center pt-0.5">
                <div className="inline-flex items-center justify-center gap-2.5 sm:gap-3.5 px-4 sm:px-6 py-1.5 sm:py-2 bg-zinc-900 border border-zinc-750 rounded-xl shadow-sm select-none">
                  <span className="font-tactical font-black text-lg sm:text-2xl tracking-widest uppercase text-white leading-none">
                    LIST
                  </span>
                  <HelmetLogo className="w-8 h-8 sm:w-10 sm:h-10 rounded-xl shrink-0 shadow-sm" />
                  <span className="font-tactical font-black text-lg sm:text-2xl tracking-widest uppercase text-amber-400 leading-none">
                    MAKER
                  </span>
                </div>
              </div>

              {/* 0. APP BAR: FACTION (LEFT) & ACTIONS (RIGHT) */}
              <div className="flex items-center justify-between gap-1.5 sm:gap-2">
                {/* Left: Faction Selector */}
                <div className="flex items-center min-w-0">
                  <div className="flex items-center gap-1 bg-zinc-900 border border-zinc-750 rounded-lg px-2 sm:px-2.5 h-8 sm:h-9 text-[11px] sm:text-xs font-mono">
                    <span className="text-zinc-400 text-[10px] uppercase font-bold hidden sm:inline">Faction:</span>
                    <select
                      value={activeFactionId}
                      onChange={(e) => {
                        setActiveFactionId(e.target.value);
                        setPlatoons([{ id: 1, typeId: 'infantry', period: 'All', slots: {} }]);
                        setActivePlatoonId(1);
                      }}
                      className="bg-transparent text-amber-400 font-bold text-[11px] sm:text-xs focus:outline-none cursor-pointer max-w-[130px] sm:max-w-none truncate"
                    >
                      {availableFactions.map(fId => (
                        <option key={fId} value={fId} className="bg-zinc-900 text-white">
                          {FACTIONS_REGISTRY[fId]?.faction || fId}
                        </option>
                      ))}
                    </select>
                  </div>
                </div>

                {/* Right: Actions & Account */}
                <div className="flex items-center justify-end gap-1 sm:gap-1.5 shrink-0">
                  <button
                    type="button"
                    onClick={handleNewList}
                    className="h-8 sm:h-9 px-2 sm:px-2.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-750 text-zinc-200 hover:text-white text-[11px] sm:text-xs font-mono font-bold flex items-center gap-1 transition-colors cursor-pointer"
                    title="New list"
                  >
                    <Plus className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
                    <span className="hidden md:inline">New</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => setIsMyListsOpen(true)}
                    className="h-8 sm:h-9 px-2 sm:px-2.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-750 text-zinc-200 hover:text-white text-[11px] sm:text-xs font-mono font-bold flex items-center gap-1 transition-colors cursor-pointer"
                    title="My Saved Lists (Cloud & Device)"
                  >
                    <FolderIcon className="w-3.5 h-3.5 sm:w-4 sm:h-4 text-amber-400" />
                    <span className="hidden md:inline">My Lists</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => handleCloudSave(false)}
                    disabled={isSaving}
                    className="h-8 sm:h-9 px-2.5 sm:px-3 rounded-lg bg-amber-400 hover:bg-amber-300 disabled:opacity-60 text-black text-[11px] sm:text-xs font-mono font-extrabold flex items-center gap-1 transition-colors shadow cursor-pointer"
                    title={user ? (currentListId ? 'Save changes to Cloud' : 'Save list to Cloud') : 'Save list'}
                  >
                    <CloudIcon className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
                    <span className="hidden sm:inline">{isSaving ? 'Saving...' : 'Save'}</span>
                  </button>

                  {user ? (
                    <div className="relative">
                      <button
                        type="button"
                        onClick={() => setIsUserMenuOpen((v) => !v)}
                        className="h-8 sm:h-9 px-1.5 sm:px-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-amber-300 font-black font-mono text-[11px] sm:text-xs flex items-center gap-1.5 transition-colors cursor-pointer"
                        title={user.email}
                      >
                        {(user.user_metadata?.avatar_url || user.user_metadata?.picture || user.picture) ? (
                          <img
                            src={user.user_metadata?.avatar_url || user.user_metadata?.picture || user.picture}
                            alt=""
                            className="w-5 h-5 sm:w-6 sm:h-6 rounded-full object-cover"
                            referrerPolicy="no-referrer"
                          />
                        ) : (
                          <span className="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-amber-400/20 text-amber-300 flex items-center justify-center uppercase">
                            {(user.email || '?')[0]}
                          </span>
                        )}
                        <span className="hidden md:inline text-zinc-200 font-semibold max-w-[120px] truncate normal-case">
                          {user.user_metadata?.full_name || user.user_metadata?.name || user.name || (user.email || '').split('@')[0]}
                        </span>
                      </button>
                      {isUserMenuOpen && (
                        <div className="absolute right-0 top-full mt-2 z-50 w-64 bg-zinc-900 border border-zinc-700 rounded-xl shadow-2xl overflow-hidden">
                          <div className="px-3.5 py-2.5 bg-zinc-950 border-b border-zinc-800">
                            <div className="text-[10px] font-mono uppercase text-zinc-500">Signed in as</div>
                            {(user.user_metadata?.full_name || user.user_metadata?.name || user.name) && (
                              <div className="text-xs font-bold text-white truncate">
                                {user.user_metadata?.full_name || user.user_metadata?.name || user.name}
                              </div>
                            )}
                            <div className="text-[11px] font-mono text-zinc-400 truncate">{user.email}</div>
                          </div>
                          <div className="p-1.5 space-y-0.5 text-xs font-mono">
                            <button
                              type="button"
                              onClick={() => setIsMyListsOpen(true)}
                              className="w-full text-left px-3 py-2.5 rounded-lg text-zinc-200 hover:bg-zinc-800 flex items-center gap-2 cursor-pointer"
                            >
                              <FolderIcon className="w-4 h-4 text-amber-400" /> My Lists
                            </button>
                            <button
                              type="button"
                              onClick={() => handleCloudSave(true)}
                              className="w-full text-left px-3 py-2.5 rounded-lg text-zinc-200 hover:bg-zinc-800 flex items-center gap-2 cursor-pointer"
                            >
                              <CloudIcon className="w-4 h-4 text-amber-400" /> Save as new list
                            </button>
                            <button
                              type="button"
                              onClick={handleSignOut}
                              className="w-full text-left px-3 py-2.5 rounded-lg text-red-300 hover:bg-red-950/60 flex items-center gap-2 cursor-pointer"
                            >
                              <LogOutIcon className="w-4 h-4" /> Sign out
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  ) : (
                    <button
                      type="button"
                      onClick={() => setIsAuthModalOpen(true)}
                      className="h-8 sm:h-9 px-2 sm:px-2.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-zinc-200 hover:text-white text-[11px] sm:text-xs font-mono font-bold flex items-center gap-1 transition-colors cursor-pointer"
                      title="Sign in to sync lists across devices"
                    >
                      <UserIcon className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
                      <span className="hidden sm:inline">Sign In</span>
                    </button>
                  )}
                </div>
              </div>

              {/* 1. CONTROL BAR: LIST NAME, PLATOON TABS, PERIOD SELECTOR & LIVE TOTALS */}
              <div className="bg-zinc-900 border border-zinc-750 rounded-xl px-2.5 sm:px-3.5 py-2 flex flex-wrap items-center justify-between gap-2 sm:gap-3 text-[11px] sm:text-xs font-mono shadow-sm">
                <div className="flex flex-wrap items-center gap-1.5 sm:gap-2.5 min-w-0">
                  {/* Army List Name (In place of Faction Selector) */}
                  <div className="flex items-center bg-zinc-850 border border-zinc-750 rounded-lg px-2 py-0.5 sm:py-1">
                    <input
                      type="text"
                      value={armyListName}
                      onChange={(e) => setArmyListName(e.target.value)}
                      placeholder="Untitled..."
                      className="bg-transparent text-amber-300 font-bold text-[11px] sm:text-xs font-mono focus:outline-none w-28 sm:w-44 placeholder-zinc-500 truncate"
                      title="Click to rename list"
                    />
                  </div>

                  {/* Platoon Tabs */}
                  <div className="relative flex flex-wrap items-center gap-1.5" ref={platoonDropdownRef}>
                    <span className="hidden sm:inline text-zinc-300 font-bold">Platoon:</span>

                    {platoons.map((p) => {
                      const isActive = p.id === activePlatoonId;
                      const pType = platoonTypes.find(t => t.id === p.typeId) || platoonTypes[0];

                      return (
                        <div
                          key={p.id}
                          onClick={() => handlePlatoonButtonClick(p.id)}
                          className={`h-6 sm:h-7 pl-2 ${platoons.length > 1 ? 'pr-1' : 'pr-1.5'} rounded text-[10.5px] sm:text-xs font-bold transition-all flex items-center gap-1 cursor-pointer select-none ${
                            isActive
                              ? 'bg-amber-400 text-black shadow-md font-extrabold ring-1 ring-amber-300'
                              : 'bg-zinc-800 text-zinc-200 hover:bg-zinc-750 hover:text-white border border-zinc-700/80'
                          }`}
                          title={isActive ? "Click to change platoon type" : `Switch to Platoon #${p.id}`}
                        >
                          <span>#{p.id}</span>
                          <span className="uppercase tracking-wider font-semibold text-[10px] sm:text-[10.5px] opacity-90 truncate max-w-[110px] sm:max-w-none">
                            {pType?.name || p.typeId}
                          </span>
                          <ChevronDown className={`w-3 h-3 sm:w-3.5 sm:h-3.5 opacity-75 transition-transform shrink-0 ${isActive && isPlatoonDropdownOpen ? 'rotate-180' : ''}`} />

                          {platoons.length > 1 && (
                            <button
                              type="button"
                              onClick={(e) => handleDeletePlatoon(e, p.id)}
                              className={`ml-0.5 w-3.5 h-3.5 sm:w-4 sm:h-4 rounded flex items-center justify-center text-xs leading-none font-mono font-black transition-colors cursor-pointer ${
                                isActive
                                  ? 'text-black/65 hover:text-red-700 hover:bg-black/15'
                                  : 'text-zinc-400 hover:text-red-400 hover:bg-zinc-900/80'
                              }`}
                              title={`Remove Platoon #${p.id}`}
                            >
                              ×
                            </button>
                          )}
                        </div>
                      );
                    })}
                    <button
                      onClick={handleAddPlatoon}
                      className="h-6 sm:h-7 px-1.5 sm:px-2 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 hover:text-white border border-dashed border-zinc-600 flex items-center justify-center gap-1 transition-colors font-bold text-xs cursor-pointer"
                      title="Add Platoon"
                    >
                      <Plus className="w-3 h-3 sm:w-3.5 sm:h-3.5 text-amber-400" />
                    </button>
                    {/* Platoon Type Dropdown */}
                    {isPlatoonDropdownOpen && (
                      <div className="absolute left-0 top-full mt-2 z-50 w-64 sm:w-80 max-w-[calc(100vw-2rem)] bg-zinc-900 border border-zinc-700 rounded-xl shadow-2xl overflow-hidden backdrop-blur-md animate-in fade-in slide-in-from-top-1 duration-150">
                        <div className="px-3.5 py-2 bg-zinc-950 border-b border-zinc-800 text-[11px] font-mono text-zinc-400 flex items-center justify-between">
                          <span>Select Selector for <strong>Platoon #{activePlatoonId}</strong></span>
                          <button
                            onClick={() => setIsPlatoonDropdownOpen(false)}
                            className="text-zinc-500 hover:text-white text-xs"
                          >
                            ✕
                          </button>
                        </div>

                        <div className="p-1.5 space-y-1">
                          {platoonTypes.map((t) => {
                            const isSelected = currentPlatoon.typeId === t.id;
                            return (
                              <button
                                key={t.id}
                                onClick={() => handleSelectPlatoonType(t.id)}
                                className={`w-full text-left px-3 py-2 rounded-lg text-xs font-mono font-bold tracking-wider uppercase transition-colors flex items-center justify-between cursor-pointer ${
                                  isSelected
                                    ? 'bg-amber-400/15 text-amber-300 border border-amber-500/30'
                                    : 'text-zinc-300 hover:bg-zinc-800 hover:text-white'
                                }`}
                              >
                                <div className="min-w-0">
                                  <div className="truncate">{t.title}</div>
                                  <div className="text-[9.5px] font-normal text-zinc-500 normal-case truncate">{t.officialTitle}</div>
                                </div>
                                {isSelected && <Check className="w-4 h-4 text-amber-400 shrink-0 ml-2" />}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>

                </div>

                {/* Live Points & Order Dice (Tablet/Desktop; mobile uses fixed bottom bar) */}
                <div className="hidden sm:flex items-center gap-3 text-xs font-mono text-zinc-300">
                  <div>
                    Platoon: <strong className="text-zinc-100">{currentPlatoonPoints} pts</strong>
                  </div>
                  <div className="h-3 w-px bg-zinc-700" />
                  <div>
                    Total Points: <strong className="text-sm font-bold text-white">{totalPoints}</strong>
                  </div>
                  <div className="h-3 w-px bg-zinc-700" />
                  <div className="flex items-center gap-1.5">
                    <span>Order Dice:</span>
                    <strong className="text-sm font-bold text-amber-400">{totalOrderDice}</strong>
                  </div>
                </div>

              </div>

              {/* 3. 5-COLUMN SLOT GRID (Exact EasyArmy Platoon Structure) */}
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-1.5 sm:gap-2 items-start pt-0.5">
                {(currentType?.columns || []).map((col, colIdx) => (
                  <div key={col.id || colIdx} className="space-y-1.5">
                    {col.slots.map((slot) => (
                      <Slot
                        key={slot.id}
                        slot={slot}
                        factionData={factionData}
                        platoonTypeId={currentType.id}
                        periodKey={currentPlatoon.period || 'All'}
                        value={currentPlatoon.slots[slot.id]}
                        onSelect={(unitName, slotLabel) => handleSelectSlot(slot.id, unitName, slotLabel)}
                        onEdit={(slotId, unitItem, slotLabel) => handleOpenEditModal(slotId, unitItem, slotLabel)}
                        onClear={() => handleClearSlot(slot.id)}
                      />
                    ))}
                  </div>
                ))}
              </div>
            </div>
            {/* FLOATING EXPORT BUTTON (tablet / desktop) */}
            <div className="hidden sm:block fixed bottom-[max(1.5rem,env(safe-area-inset-bottom))] right-6 z-40 no-print">
              <button
                type="button"
                onClick={() => setIsExportModalOpen(true)}
                className="h-10 px-4 rounded-xl bg-amber-400 hover:bg-amber-300 active:scale-95 text-black font-extrabold text-sm font-tactical uppercase tracking-wider transition-all duration-150 shadow-2xl border border-amber-300 flex items-center gap-2 cursor-pointer"
              >
                <DownloadIcon className="w-4 h-4 text-black" />
                <span className="font-black tracking-wide">EXPORT</span>
              </button>
            </div>

            {/* MOBILE BOTTOM BAR (app mode): live totals + export */}
            <div className="sm:hidden fixed bottom-0 inset-x-0 z-40 no-print bg-zinc-950/95 backdrop-blur-md border-t border-zinc-800 safe-bottom safe-x pt-1.5">
              <div className="flex items-center justify-between gap-2">
                <div className="flex items-center gap-2.5 font-mono text-[10px] text-zinc-400 min-w-0">
                  <div className="leading-tight">
                    <div className="uppercase text-[9px]">Total</div>
                    <div className="text-white font-black text-sm">{totalPoints}<span className="text-[9.5px] text-zinc-500 font-bold"> pts</span></div>
                  </div>
                  <div className="h-6 w-px bg-zinc-800" />
                  <div className="leading-tight">
                    <div className="uppercase text-[9px]">Dice</div>
                    <div className="text-amber-400 font-black text-sm">{totalOrderDice}</div>
                  </div>
                  <div className="h-6 w-px bg-zinc-800" />
                  <div className="leading-tight min-w-0">
                    <div className="uppercase text-[9px]">Platoon</div>
                    <div className="text-zinc-200 font-bold text-xs truncate">{currentPlatoonPoints} pts</div>
                  </div>
                </div>
                <button
                  type="button"
                  onClick={() => setIsExportModalOpen(true)}
                  className="h-9 px-3.5 rounded-lg bg-amber-400 active:bg-amber-300 text-black font-black text-[11px] font-tactical uppercase tracking-wider flex items-center gap-1.5 shadow-lg shrink-0 cursor-pointer"
                >
                  <DownloadIcon className="w-3.5 h-3.5" />
                  EXPORT
                </button>
              </div>
            </div>

            {/* ACCOUNT MODALS */}
            <AuthModal isOpen={isAuthModalOpen} onClose={() => setIsAuthModalOpen(false)} />
            <MyListsModal
              isOpen={isMyListsOpen}
              onClose={() => setIsMyListsOpen(false)}
              user={user}
              currentListId={currentListId}
              onLoadList={handleLoadCloudList}
              onSaveCurrentAsNew={() => handleCloudSave(true)}
              onListDeleted={(id) => {
                if (id === currentListId) setCurrentListId(null);
              }}
            />

            {/* FULL-WINDOW UNIT EDIT MODAL */}
            <UnitEditModal
              isOpen={editingUnitModal.isOpen}
              onClose={() => setEditingUnitModal({ isOpen: false, slotId: null, slotLabel: null, unitItem: null })}
              factionData={factionData}
              unitItem={editingUnitModal.unitItem}
              slotLabel={editingUnitModal.slotLabel}
              onSave={handleSaveUnitFromModal}
              onClearUnit={() => {
                if (editingUnitModal.slotId) {
                  handleClearSlot(editingUnitModal.slotId);
                }
              }}
            />
            {/* EXPORT MODAL */}
            <ExportModal
              isOpen={isExportModalOpen}
              onClose={() => setIsExportModalOpen(false)}
              factionData={factionData}
              armyListName={armyListName}
              setArmyListName={setArmyListName}
              armyNotes={armyNotes}
              setArmyNotes={setArmyNotes}
              totalPoints={totalPoints}
              totalOrderDice={totalOrderDice}
              platoons={platoons}
              onDirectPDFDownload={handleDirectPDFDownload}
              isGeneratingPdf={isGeneratingPdf}
            />

            {/* PRINT-ONLY ROSTER */}
            <div id="printable-army-roster" className="print-only">
              <ArmyRosterPrintView
                factionData={factionData}
                armyListName={armyListName}
                armyNotes={armyNotes}
                totalPoints={totalPoints}
                totalOrderDice={totalOrderDice}
                platoons={platoons}
                isPreview={false}
              />
            </div>
          </div>
        );
      }
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
