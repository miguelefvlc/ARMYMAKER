<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ARMY MAKER</title>
    <!-- PWA / Standalone App Mode (No browser bars, full app feel) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#161B15" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ARMY MAKER" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
    <script>
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function (reg) {
            reg.update();
          }).catch(function () {});
        });
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              tactical: ['Chakra Petch', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              tacticalRed: '#733028',
              tacticalRedHover: '#85382F',
              zinc: {
                50: '#F7F5EE',
                100: '#EFECE1',
                200: '#E2DEC9',
                300: '#C8C5B0',
                400: '#9FA896',
                500: '#78826E',
                600: '#5C6950',
                700: '#4A5B3E',
                750: '#3D4B34',
                800: '#333F2D',
                850: '#283224',
                900: '#20281E',
                950: '#161B15',
              },
              amber: {
                50: '#FBF8EB',
                100: '#F5ECC8',
                200: '#EFE09E',
                300: '#EAD071',
                400: '#DFBF52',
                500: '#C4A238',
                600: '#9E8025',
              },
            }
          }
        }
      }
    </script>

    <!-- React 18 & Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script>
      window.useState = React.useState;
      window.useEffect = React.useEffect;
      window.useRef = React.useRef;
      window.useMemo = React.useMemo;
      window.useCallback = React.useCallback;
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- html2pdf.js for direct PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Faction Data Modules (Scalable Multi-Faction Registry: window.EASYARMY_FACTIONS) -->
    <script src="./factions/soviet_union_app_data.js"></script>
    <script src="./factions/germany_app_data.js"></script>
    <script src="./factions/japan_app_data.js"></script>
    <script src="./factions/usa_app_data.js"></script>
    <script src="./factions/great_britain_app_data.js"></script>
    <script src="./factions/italy_app_data.js"></script>
    <script src="./factions/france_app_data.js"></script>
    <!-- Accounts & cloud-saved lists (Supabase) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100 antialiased selection:bg-amber-400 selection:text-black">
    <div id="root"></div>

    <!-- Application Engine & Services -->
    <script src="./js/engine.js"></script>
    <script src="./js/storage.js"></script>

    <!-- UI Iconography & Insignia -->
    <script type="text/babel" src="./js/icons.js"></script>

    <!-- UI Modular Components -->
    <script type="text/babel" src="./js/components/Modals.js"></script>
    <script type="text/babel" src="./js/components/UnitEditModal.js"></script>
    <script type="text/babel" src="./js/components/Slot.js"></script>
    <script type="text/babel" src="./js/components/ArmyRosterPrintView.js"></script>

    <!-- Main React App Shell -->
    <script type="text/babel" src="./js/app.js"></script>
  </body>
</html>
