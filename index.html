            {type === 'observer' && (
              <polygon points="18,9.5 11.5,22 24.5,22" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" />
            )}

            {type === 'sniper' && (
              <>
                <circle cx="18" cy="16" r="4.6" fill="none" stroke="currentColor" strokeWidth="1.5" />
                <line x1="18" y1="9.2" x2="18" y2="22.8" stroke="currentColor" strokeWidth="1.5" />
                <line x1="11.2" y1="16" x2="24.8" y2="16" stroke="currentColor" strokeWidth="1.5" />
              </>
            )}

            {type === 'anti_tank' && (
              <polyline points="2,26 18,6 34,26" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" />
            )}

            {type === 'mortar' && (
              <>
                <line x1="2" y1="6" x2="7.5" y2="9.5" stroke="currentColor" strokeWidth="1.5" />
                <line x1="34" y1="6" x2="28.5" y2="9.5" stroke="currentColor" strokeWidth="1.5" />
                <line x1="2" y1="26" x2="7.5" y2="22.5" stroke="currentColor" strokeWidth="1.5" />
                <line x1="34" y1="26" x2="28.5" y2="22.5" stroke="currentColor" strokeWidth="1.5" />
                <circle cx="18" cy="20.8" r="2.4" fill="currentColor" />
                <line x1="18" y1="9.5" x2="18" y2="20" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
              </>
            )}

            {type === 'mg' && (
              <>
                <line x1="2" y1="6" x2="7.5" y2="9.5" stroke="currentColor" strokeWidth="1.5" />
                <line x1="34" y1="6" x2="28.5" y2="9.5" stroke="currentColor" strokeWidth="1.5" />
                <line x1="2" y1="26" x2="7.5" y2="22.5" stroke="currentColor" strokeWidth="1.5" />
                <line x1="34" y1="26" x2="28.5" y2="22.5" stroke="currentColor" strokeWidth="1.5" />
                <text x="18" y="19.3" textAnchor="middle" fill="currentColor" fontSize="9.2" fontWeight="800" fontFamily="Inter, sans-serif" letterSpacing="0.3">
                  MG
                </text>
              </>
            )}

            {type === 'engineer' && (
              <path
                d="M7.5 21.5 V11.5 H28.5 V21.5 M18 11.5 V18.5"
                fill="none"
                stroke="currentColor"
                strokeWidth="1.6"
                strokeLinecap="square"
                strokeLinejoin="miter"
              />
            )}

            {type === 'flamethrower' && (
              <>
                <polyline points="2,6 18,16 34,6" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" />
                <line x1="18" y1="16" x2="18" y2="26" stroke="currentColor" strokeWidth="1.6" />
              </>
            )}

            {type === 'artillery' && (
              <circle cx="18" cy="16" r="3.4" fill="currentColor" />
            )}

            {type === 'armoured_hq' && (
              <>
                <rect x="6" y="9.5" width="24" height="13" rx="5.5" fill="none" stroke="currentColor" strokeWidth="1.5" />
                <text x="18" y="18.8" textAnchor="middle" fill="currentColor" fontSize="8.2" fontWeight="800" fontFamily="Inter, sans-serif" letterSpacing="0.3">
                  HQ
                </text>
              </>
            )}

            {type === 'armoured' && (
              <rect x="6" y="9.5" width="24" height="13" rx="5.5" fill="none" stroke="currentColor" strokeWidth="1.6" />
            )}

            {type === 'transport' && (
              <>
                <circle cx="18" cy="16" r="5.5" fill="none" stroke="currentColor" strokeWidth="1.5" />
                <line x1="18" y1="10.5" x2="18" y2="21.5" stroke="currentColor" strokeWidth="1.2" />
                <line x1="12.5" y1="16" x2="23.5" y2="16" stroke="currentColor" strokeWidth="1.2" />
                <line x1="14.1" y1="12.1" x2="21.9" y2="19.9" stroke="currentColor" strokeWidth="1.2" />
                <line x1="21.9" y1="12.1" x2="14.1" y2="19.9" stroke="currentColor" strokeWidth="1.2" />
              </>
            )}
          </svg>
        );
      }

      // =========================================================================
      // SLOT COMPONENT (Original EasyArmy Slot Names & Period-Filtered Units)
      // =========================================================================
      function Slot({ slot, factionData, platoonTypeId, periodKey, value, onSelect, onEdit, onClear }) {
        const [isOpen, setIsOpen] = useState(false);
        const [searchTerm, setSearchTerm] = useState("");
        const dropdownRef = useRef(null);
        const def = useMemo(() => {
          if (!value) return null;
          return getUnitDefinition(factionData, value.name);
        }, [factionData, value]);

        const summary = useMemo(() => {
          if (!value || !def) return null;
          return getUnitSummary(def, value.config);
        }, [def, value]);
        const availableUnits = useMemo(() => {
          const sKey = slot.slotKey || slot.label;
          const periodSlots = factionData?.platoonPeriods?.[platoonTypeId]?.[periodKey || 'All']?.slots;
          if (periodSlots && periodSlots[sKey]) {
            return periodSlots[sKey];
          }
          return factionData?.slotCatalog?.[sKey] || factionData?.slotCatalog?.[slot.label] || [];
        }, [factionData, platoonTypeId, periodKey, slot]);

        const filteredUnits = useMemo(() => {
          if (!searchTerm) return availableUnits;
          const q = searchTerm.toLowerCase();
          return availableUnits.filter(u => u.toLowerCase().includes(q));
        }, [availableUnits, searchTerm]);

        useEffect(() => {
          function handleClickOutside(event) {
            if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
              setIsOpen(false);
              setSearchTerm("");
            }
          }
          if (isOpen) {
            document.addEventListener('mousedown', handleClickOutside);
          }
          return () => document.removeEventListener('mousedown', handleClickOutside);
        }, [isOpen]);
        const isMandatory = slot.mandatory;
        const isFilled = !!value;

        return (
          <div className="relative w-full" ref={dropdownRef}>
            <div
              className={`w-full rounded-md border transition-all duration-150 overflow-hidden select-none ${
                isFilled
                  ? isMandatory
                    ? 'border-amber-400/80 bg-zinc-900 shadow-md ring-1 ring-amber-400/30'
                    : 'border-amber-400/70 bg-zinc-900 shadow-md ring-1 ring-amber-400/20'
                  : isMandatory
                    ? 'border-[#8C3D32]/50 bg-zinc-950/80 opacity-65 hover:opacity-95'
                    : 'border-zinc-800 bg-zinc-950/80 opacity-60 hover:opacity-90'
              }`}
            >
              {/* Slot Header (Exact EasyArmy Section Name) */}
              <div
                onClick={() => {
                  if (isFilled) {
                    onEdit(slot.id, value, slot.label);
                  } else {
                    setIsOpen(!isOpen);
                  }
                }}
                className={`px-2 py-1 flex items-center justify-between gap-1.5 cursor-pointer text-xs font-medium tracking-wide transition-colors ${
                  isMandatory
                    ? isFilled
                      ? 'bg-[#733028] hover:bg-[#85382F] text-[#F7F5EE] shadow-sm'
                      : 'bg-[#733028]/75 hover:bg-[#733028] text-zinc-300'
                    : isFilled
                      ? 'bg-[#3D4B35] hover:bg-[#4A5B3E] text-[#F7F5EE]'
                      : 'bg-[#2A3525] hover:bg-[#3D4B35] text-zinc-400'
                }`}
              >
                <div className="flex items-center gap-1.5 min-w-0">
                  {isFilled && (
                    <UnitTacticalIcon
                      slot={slot}
                      unitName={value.name}
                      platoonTypeId={platoonTypeId}
                      className="w-5 h-4 text-amber-300 shrink-0"
                    />
                  )}
                  <span className="truncate font-bold text-[10.5px] sm:text-[11px] uppercase tracking-wider">{slot.label}</span>
                </div>
                {!isFilled && (
                  <span className="font-mono font-bold text-[11px] shrink-0 text-amber-300 leading-tight select-none">
                    {isOpen ? '[-]' : '[+]'}
                  </span>
                )}
              </div>
              {/* Slot Body */}
              <div
                onClick={() => {
                  if (isFilled) {
                    onEdit(slot.id, value, slot.label);
                  } else {
                    setIsOpen(!isOpen);
                  }
                }}
                className={`px-2 py-1 flex items-center justify-between cursor-pointer transition-colors text-xs ${
                  isFilled
                    ? 'bg-zinc-850 hover:bg-zinc-800'
                    : 'bg-zinc-950/90 hover:bg-zinc-900/90 min-h-[26px] sm:min-h-[28px]'
                }`}
              >
                {isFilled ? (
                  <div className="flex items-center justify-between w-full gap-1.5">
                    <div className="min-w-0 flex-1">
                      <div className="font-semibold text-amber-300 truncate font-mono text-[10.5px] sm:text-[11px] leading-tight">
                        {value.name}
                      </div>
                      <div className="text-[9.5px] sm:text-[10px] text-zinc-400 font-mono flex items-center gap-1 leading-tight mt-0.5">
                        <span className="text-zinc-300 truncate">{EXP_LABELS[value.config?.experience] || value.config?.experience || "Regular"}</span>
                        <span className="text-zinc-600">•</span>
                        {summary?.headCountText && (
                          <>
                            <span className="text-zinc-300 shrink-0">{summary.headCountText}</span>
                            <span className="text-zinc-600">•</span>
                          </>
                        )}
                        <span className="text-amber-300 font-bold shrink-0">{value.points || 0} pts</span>
                      </div>
                    </div>

                    <div className="flex items-center shrink-0">
                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          onClear(slot.id);
                        }}
                        className="text-zinc-500 hover:text-red-400 p-0.5 rounded transition-colors"
                        title="Remove unit"
                      >
                        <XIcon className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="w-full h-3 sm:h-3.5" />
                )}
              </div>
            </div>
            {/* DROPDOWN UNIT SELECTOR */}
            {isOpen && (
              <div className="absolute left-0 right-0 top-full mt-1 z-50 min-w-[230px] sm:min-w-[300px] max-w-[calc(100vw-1.5rem)] bg-zinc-900 border border-zinc-700 rounded-lg shadow-2xl overflow-hidden backdrop-blur-md animate-in fade-in duration-100">
                <div className="px-3 py-2 bg-zinc-950 border-b border-zinc-800 flex items-center justify-between text-[11px] font-mono text-zinc-400">
                  <span className="uppercase tracking-wider font-bold text-zinc-200">{slot.label} ({availableUnits.length})</span>
                  <button
                    onClick={() => { setIsOpen(false); setSearchTerm(""); }}
                    className="text-zinc-500 hover:text-white"
                  >
                    ✕
                  </button>
                </div>

                {availableUnits.length > 5 && (
                  <div className="p-2 border-b border-zinc-800/80 bg-zinc-950/50">
                    <div className="flex items-center gap-1.5 px-2 py-1 rounded bg-zinc-900 border border-zinc-800 text-xs">
                      <Search className="w-3 h-3 text-zinc-500 shrink-0" />
                      <input
                        type="text"
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        placeholder="Search unit..."
                        className="w-full bg-transparent text-zinc-200 placeholder-zinc-500 text-xs focus:outline-none font-mono"
                        autoFocus
                      />
                      {searchTerm && (
                        <button onClick={() => setSearchTerm("")} className="text-zinc-500 hover:text-white">✕</button>
                      )}
                    </div>
                  </div>
                )}
                <div className="max-h-72 overflow-y-auto p-1 space-y-0.5">
                  {filteredUnits.length > 0 ? (
                    filteredUnits.map((unitName, index) => {
                      const isSelected = value?.name === unitName;
                      const uDef = getUnitDefinition(factionData, unitName);
                      const basePts = uDef.costs[uDef.defaultExp]?.points ?? Object.values(uDef.costs)[0]?.points ?? 0;
                      return (
                        <button
                          key={index}
                          onClick={() => {
                            onSelect(unitName, slot.label);
                            setIsOpen(false);
                            setSearchTerm("");
                          }}
                          className={`w-full text-left px-2.5 py-1.5 rounded text-xs font-mono transition-colors flex items-center justify-between gap-2 ${
                            isSelected
                              ? 'bg-amber-400/20 text-amber-300 font-bold border border-amber-500/30'
                              : 'text-zinc-300 hover:bg-zinc-800 hover:text-white'
                          }`}
                        >
                          <span className="truncate text-[11.5px]">{unitName}</span>
                          <div className="flex items-center gap-1.5 shrink-0">
                            {uDef.period && (
                              <span className="text-[9.5px] px-1 py-0.2 rounded bg-zinc-800 text-zinc-400">
                                {uDef.period}
                              </span>
                            )}
                            <span className="text-[10.5px] text-amber-400/90 font-semibold">
                              {basePts} pts
                            </span>
                            {isSelected && <Check className="w-3.5 h-3.5 text-amber-400 shrink-0" />}
                          </div>
                        </button>
                      );
                    })
                  ) : (
                    <div className="p-3 text-center text-xs text-zinc-500 font-mono">
                      No units matching filter
                    </div>
                  )}
                </div>
                {isFilled && (
                  <div className="p-1.5 bg-zinc-950/80 border-t border-zinc-800">
                    <button
                      onClick={() => {
                        onClear(slot.id);
                        setIsOpen(false);
                        setSearchTerm("");
                      }}
                      className="w-full py-1 rounded bg-zinc-800 hover:bg-red-950/80 text-zinc-400 hover:text-red-300 text-[10.5px] font-mono transition-colors border border-zinc-700/60"
                    >
                      Remove selected unit
                    </button>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      }
      // =========================================================================
      // PRINTABLE / PDF ARMY ROSTER VIEW (EasyArmy Breakdown Table + Clean UI)
      // =========================================================================
      function cleanSpecialText(s) {
        if (!s || s === '-') return '';
        return s;
      }

      function findUnitWeaponRow(def, regex, fallback) {
        const found = (def?.weaponsTable || []).find(
          (w) => w.rowType !== 'vehicle_stat' && regex.test(w.name || '')
        );
        if (found) {
          return {
            range: found.range && found.range !== '-' ? found.range : fallback.range,
            shots: found.shots && found.shots !== '-' ? found.shots : fallback.shots,
            pen: found.pen && found.pen !== '-' ? found.pen : fallback.pen,
            special: cleanSpecialText(found.special) || fallback.special,
          };
        }
        return fallback;
      }

      function buildUnitRosterTable(def, config) {
        if (!def) return { isVehicle: false, rows: [] };
        const options = config?.options || {};
        const extraMen = Number(config?.extraMen || 0);
        const hasVehicleRows = (def.weaponsTable || []).some((w) => w.rowType === 'vehicle_stat');
        const isVehicle = !!def.damageValue || hasVehicleRows;

        // Collect selected option objects
        const activeOpts = [];
        for (const opt of def.optionsList || []) {
          if (opt.id === 'extra_men') continue;
          const val = options[opt.id];
          if (!val) continue;
          activeOpts.push({ opt, val, count: opt.type === 'counter' ? Number(val) : 1 });
        }

        // ---------------------------------------------------------------------
        // CASE 1: VEHICLES & TRANSPORTS
        // ---------------------------------------------------------------------
        if (isVehicle) {
          const variants = [];
          let current = null;
          for (const w of def.weaponsTable || []) {
            if (w.rowType === 'vehicle_stat') {
              current = { chassis: w, weapons: [] };
              variants.push(current);
            } else {
              if (!current) {
                current = {
                  chassis: {
                    name: def.cardTitle || def.name,
                    range: 'Tracked',
                    shots: def.transport ? String(def.transport) : '-',
                    pen: def.damageValue || '-',
                    special: def.specialRulesText || '',
                  },
                  weapons: [],
                };
                variants.push(current);
              }
              current.weapons.push(w);
            }
          }

          const allOptText = activeOpts.map((x) => `${x.opt.group || ''} ${x.opt.rawText || x.opt.label}`).join(' ').toLowerCase();
          const wantsFlamethrower = /flamethrower|\bot-/i.test(allOptText);

          let chosen = variants[0] || null;
          if (variants.length > 1) {
            if (wantsFlamethrower) {
              chosen = variants.find((v) => /flamethrower|\bot-/i.test(v.chassis.name)) || chosen;
            } else {
              // Match specific named option variant (e.g. Tractor Factory T-34 defects) or non-flamethrower default
              const byOpt = variants.find((v) => {
                const m = v.chassis.name.match(/\(([^)]+)\)/);
                return m && allOptText.includes(m[1].toLowerCase());
              });
              if (byOpt) {
                chosen = byOpt;
              } else {
                chosen =
                  variants.find((v) => !/flamethrower|\bot-/i.test(v.chassis.name)) || chosen;
              }
            }
          }

          const rows = [];
          if (chosen?.chassis) {
            rows.push({
              qty: '1',
              weapons: chosen.chassis.name,
              range: chosen.chassis.range || '-',
              shots: chosen.chassis.shots || '-',
              pen: chosen.chassis.pen || def.damageValue || '-',
              special: cleanSpecialText(chosen.chassis.special),
              isChassis: true,
            });
          }

          const baseWText = (def.weapons || '').toLowerCase();
          const hasPintleOpt = /pintle/i.test(allOptText);
          const removesHullMmg = /remove.*hull.*mmg/i.test(allOptText);

          for (const w of chosen?.weapons || []) {
            const wn = (w.name || '').toLowerCase();
            if (wn.includes('pintle') && !baseWText.includes('pintle') && !hasPintleOpt) continue;
            if (removesHullMmg && wn.includes('hull') && wn.includes('mmg')) continue;
            if (w.range === '-' && w.shots === '-' && w.pen === '-') continue;
            rows.push({
              qty: '1',
              weapons: w.name,
              range: w.range || '-',
              shots: w.shots || '-',
              pen: w.pen || 'n/a',
              special: cleanSpecialText(w.special),
            });
          }

          for (const { opt } of activeOpts) {
            const txt = opt.rawText || opt.label || '';
            if (/pintle|flamethrower|remove.*hull|no optics|hastily repaired|factory worker/i.test(txt)) continue;
            rows.push({
              qty: '',
              weapons: txt.replace(/\s+for\s+[+-]?\d+\s*pts.*$/i, ''),
              range: '',
              shots: '',
              pen: '',
              special: /recce/i.test(txt)
                ? 'Recce'
                : /reinforced front armour/i.test(txt)
                ? 'Reinforced Front Armour'
                : /improved ballistics/i.test(txt)
                ? 'Improved Ballistics'
                : '',
            });
          }

          return { isVehicle: true, rows };
        }

        // ---------------------------------------------------------------------
        // CASE 2: ARTILLERY & WEAPONS TEAMS (Mortar, MMG, Sniper, AT Rifle, etc.)
        // ---------------------------------------------------------------------
        const compRaw = def.composition || '';
        const compLower = compRaw.toLowerCase();
        const isTeamOrArtillery =
          !!def.profile?.Team ||
          /artillery|gun|howitzer|mortar|machine gun|sniper|flamethrower|anti-tank rifle|ampulomet|dog/i.test(
            `${def.name} ${compRaw}`
          ) && !/squad|section|platoon|commander|commissar|medic|observer/i.test(def.name);

        if (isTeamOrArtillery) {
          const rows = [];
          const primaryWeapons = (def.weaponsTable || []).filter((w) => {
            if (w.rowType === 'vehicle_stat') return false;
            const wn = (w.name || '').toLowerCase();
            if (wn === 'rifles' || wn === 'rifle' || wn === 'submachine gun' || wn === 'pistol' || wn.includes('anti-tank grenades')) {
              return (def.weapons || '').toLowerCase().includes(wn);
            }
            return true;
          });

          if (primaryWeapons.length > 0) {
            primaryWeapons.forEach((w, idx) => {
              const isAltMode = /\(alt\.\s*mode\)/i.test(w.name);
              rows.push({
                qty: isAltMode ? '' : '1',
                weapons: idx === 0 && compRaw ? `${w.name} (${compRaw}${extraMen > 0 ? ` + ${extraMen} men` : ''})` : w.name,
                range: w.range || '-',
                shots: w.shots || '-',
                pen: w.pen || 'n/a',
                special: cleanSpecialText(w.special),
              });
            });
          } else {
            rows.push({
              qty: '1',
              weapons: `${def.name} (${compRaw || 'Team'})`,
              range: '-',
              shots: '-',
              pen: 'n/a',
              special: cleanSpecialText(def.specialRulesText),
            });
          }

          for (const { opt, count } of activeOpts) {
            const txt = opt.rawText || opt.label || '';
            const cleanTxt = txt.replace(/\s+(for|at)\s+[+-]?\d+\s*pts.*$/i, '');
            if (/submachine gun|\bsmg\b/i.test(txt)) {
              const smgStats = findUnitWeaponRow(def, /submachine gun|\bsmg\b/i, {
                range: '12"',
                shots: '2',
                pen: 'n/a',
                special: 'Assault',
              });
              rows.push({
                qty: String(count),
                weapons: cleanTxt,
                ...smgStats,
              });
            } else if (/spotter/i.test(txt)) {
              rows.push({ qty: '1', weapons: 'Spotter', range: '', shots: '', pen: '', special: 'Infiltrator' });
            } else if (/gun shield/i.test(txt)) {
              rows.push({ qty: '', weapons: 'Gun shield', range: '', shots: '', pen: '', special: 'Gun Shield' });
            } else {
              rows.push({
                qty: count > 1 ? String(count) : '',
                weapons: cleanTxt,
                range: '',
                shots: '',
                pen: '',
                special: /stubborn/i.test(txt)
                  ? 'Stubborn'
                  : /fanatics/i.test(txt)
                  ? 'Fanatics'
                  : /tough fighters/i.test(txt)
                  ? 'Tough fighters'
                  : '',
              });
            }
          }

          return { isVehicle: false, rows };
        }

        // ---------------------------------------------------------------------
        // CASE 3: INFANTRY SQUADS & HQ UNITS (Exact EasyArmy Roster Breakdown)
        // ---------------------------------------------------------------------
        let leaderLabel = 'NCO';
        let hasLeader = true;
        let baseMen = 0;

        const ncoMatch = compRaw.match(/(\d+)\s*nco.*?(\d+)\s*men/i);
        if (ncoMatch) {
          leaderLabel = 'NCO';
          baseMen = parseInt(ncoMatch[2], 10);
        } else if (/officer|commander/i.test(compRaw)) {
          leaderLabel = 'Officer';
          const m = compRaw.match(/and\s*(\d+)\s*men/i);
          baseMen = m ? parseInt(m[1], 10) : 0;
        } else if (/commissar/i.test(compRaw)) {
          leaderLabel = 'Commissar';
          const m = compRaw.match(/and\s*(\d+)\s*men/i);
          baseMen = m ? parseInt(m[1], 10) : 0;
        } else if (/medic/i.test(compRaw)) {
          leaderLabel = 'Medic';
          const m = compRaw.match(/and\s*(\d+)\s*(unarmed\s*)?men/i);
          baseMen = m ? parseInt(m[1], 10) : 0;
        } else if (/observer/i.test(compRaw)) {
          leaderLabel = 'Forward Observer';
          const m = compRaw.match(/and\s*(\d+)\s*men/i);
          baseMen = m ? parseInt(m[1], 10) : 0;
        } else {
          const m = compRaw.match(/(\d+)\s*men/i);
          if (m) {
            hasLeader = false;
            baseMen = parseInt(m[1], 10);
          } else {
            leaderLabel = def.name;
            baseMen = 0;
          }
        }

        const totalMen = baseMen + extraMen;
        const baseWeaponsLower = (def.weapons || '').toLowerCase();

        let defaultWeapon = 'Rifle';
        if (baseWeaponsLower.includes('submachine gun') && !baseWeaponsLower.includes('rifle')) {
          defaultWeapon = 'Submachine gun';
        } else if (baseWeaponsLower.includes('pistol') && !baseWeaponsLower.includes('rifle') && !baseWeaponsLower.includes('submachine')) {
          defaultWeapon = 'Pistol';
        } else if (baseWeaponsLower.includes('none') || baseWeaponsLower.includes('unarmed')) {
          defaultWeapon = 'Unarmed';
        }

        let leaderWeapon = defaultWeapon;
        let smgMen = 0;
        let pistolMen = 0;
        let lmgMen = /(\b1\b|one)\s+light machine gun|\b1\s+lmg\b/i.test(def.weapons || '') ? 1 : 0;
        let flamethrowerMen = 0;
        let lightMortarMen = 0;
        let atRifleMen = 0;
        const extraRows = [];

        for (const { opt, count } of activeOpts) {
          const fullText = `${opt.group || ''} ${opt.rawText || opt.label || ''}`;
          const lower = fullText.toLowerCase();
          const rawLabel = (opt.rawText || opt.label || '').replace(/\s+(for|at)\s+[+-]?\d+\s*pts.*$/i, '');

          // 1. Panzerfaust (in addition to other weapons)
          if (lower.includes('panzerfaust')) {
            const pfStats = findUnitWeaponRow(def, /panzerfaust/i, {
              range: '12"',
              shots: '1',
              pen: '+6',
              special: 'One-shot, Shaped Charge',
            });
            extraRows.push({
              qty: String(count),
              weapons: 'men have Panzerfaust in addition to other weapons',
              ...pfStats,
            });
            continue;
          }

          // 2. Anti-tank grenades
          if (lower.includes('anti-tank grenades') || lower.includes('molotov')) {
            extraRows.push({
              qty: '',
              weapons: 'Entire squad equipped with anti-tank grenades',
              range: '',
              shots: '',
              pen: '',
              special: 'Tank hunters',
            });
            continue;
          }

          // 3. Entire squad SMG replacement
          if ((lower.includes('entire squad') || lower.includes('all men')) && (lower.includes('submachine') || lower.includes('smg'))) {
            leaderWeapon = 'Submachine gun';
            defaultWeapon = 'Submachine gun';
            if (lower.includes('tough fighters')) {
              extraRows.push({
                qty: '',
                weapons: 'Submachine gun squad',
                range: '',
                shots: '',
                pen: '',
                special: 'Tough fighters',
              });
            }
            continue;
          }

          // 4. Leader-specific weapon replacement (NCO / Officer / Commissar)
          const mentionsLeader = /\b(nco|officer|commissar)\b/i.test(lower);
          const mentionsOtherMen = /\b(\d+|up to|additional)\s*men\b/i.test(lower);
          if (mentionsLeader && !mentionsOtherMen) {
            if (lower.includes('submachine') || lower.includes('smg')) {
              leaderWeapon = 'Submachine gun';
              continue;
            }
            if (lower.includes('pistol')) {
              leaderWeapon = 'Pistol';
              continue;
            }
            if (lower.includes('rifle')) {
              leaderWeapon = 'Rifle';
              continue;
            }
          }

          // 5. Men weapon replacements (SMG, LMG, Flamethrower, Light Mortar, AT Rifle, Pistol)
          if ((lower.includes('submachine') || lower.includes('smg')) && !lower.includes('guard dog')) {
            if (mentionsLeader && mentionsOtherMen) {
              // Combined option like "The NCO and up to X men may have SMGs"
              leaderWeapon = 'Submachine gun';
              smgMen += Math.min(totalMen, Math.max(0, count - 1));
            } else {
              smgMen += count;
            }
            continue;
          }

          if (lower.includes('light machine gun') || /\blmg\b/.test(lower)) {
            lmgMen += count;
            continue;
          }

          if (lower.includes('flamethrower')) {
            flamethrowerMen += count;
            continue;
          }

          if (lower.includes('light mortar')) {
            lightMortarMen += count;
            continue;
          }

          if (lower.includes('anti-tank rifle')) {
            atRifleMen += count;
            continue;
          }

          if (lower.includes('pistol') && !lower.includes('in addition')) {
            pistolMen += count;
            continue;
          }

          // 6. Other squad upgrades / special rules (Airborne, NKVD, Naval Brigade, Body Armour, Skis, Cavalry, Dogs, etc.)
          let specialRule = '';
          if (lower.includes('stubborn') || lower.includes('airborne')) specialRule = 'Stubborn';
          else if (lower.includes('fanatics') || lower.includes('nkvd')) specialRule = 'Fanatics';
          else if (lower.includes('tough fighters') || lower.includes('naval brigade')) specialRule = 'Tough fighters';
          else if (lower.includes('body armour') || lower.includes('sn-42')) specialRule = 'Body Armour';
          else if (lower.includes('skis')) specialRule = 'Winter-equipped';
          else if (lower.includes('cavalry') || lower.includes('horses')) specialRule = 'Cavalry';
          else if (lower.includes('infiltrator')) specialRule = 'Infiltrators';
          else if (lower.includes('guard dog')) specialRule = 'Guard Dog';

          extraRows.push({
            qty: opt.type === 'counter' ? String(count) : '',
            weapons: rawLabel,
            range: '',
            shots: '',
            pen: '',
            special: specialRule,
          });
        }

        const getWeaponProfile = (wName) => {
          const wl = wName.toLowerCase();
          if (wl.includes('submachine')) {
            return findUnitWeaponRow(def, /submachine gun|\bsmg\b/i, {
              range: '12"',
              shots: '2',
              pen: 'n/a',
              special: 'Assault',
            });
          }
          if (wl.includes('pistol')) {
            return findUnitWeaponRow(def, /pistol/i, {
              range: '6"',
              shots: '1',
              pen: 'n/a',
              special: 'Assault',
            });
          }
          if (wl.includes('unarmed')) {
            return { range: '-', shots: '-', pen: 'n/a', special: '' };
          }
          return findUnitWeaponRow(def, /rifle/i, {
            range: '24"',
            shots: '1',
            pen: 'n/a',
            special: '',
          });
        };

        const rows = [];

        // Leader row
        if (hasLeader) {
          const lStats = getWeaponProfile(leaderWeapon);
          rows.push({
            qty: '1',
            weapons: leaderWeapon === 'Unarmed' ? `${leaderLabel} (Unarmed)` : `${leaderLabel} with ${leaderWeapon}`,
            ...lStats,
          });
        }

        // Calculate remaining default-weapon men
        const replacedMen = smgMen + pistolMen + lmgMen + flamethrowerMen + lightMortarMen + atRifleMen;
        const remainingDefaultMen = Math.max(0, totalMen - replacedMen);

        if (remainingDefaultMen > 0) {
          const dStats = getWeaponProfile(defaultWeapon);
          rows.push({
            qty: String(remainingDefaultMen),
            weapons: defaultWeapon === 'Unarmed' ? 'Unarmed men' : `Infantry with ${defaultWeapon}`,
            ...dStats,
          });
        }

        if (smgMen > 0) {
          const smgStats = getWeaponProfile('Submachine gun');
          rows.push({
            qty: String(Math.min(totalMen, smgMen)),
            weapons: 'Infantry with Submachine gun',
            ...smgStats,
          });
        }

        if (pistolMen > 0) {
          const pStats = getWeaponProfile('Pistol');
          rows.push({
            qty: String(Math.min(totalMen, pistolMen)),
            weapons: 'Infantry with Pistol',
            ...pStats,
          });
        }

        if (lmgMen > 0) {
          const lmgStats = findUnitWeaponRow(def, /light machine gun|\blmg\b/i, {
            range: '36"',
            shots: '4',
            pen: 'n/a',
            special: '',
          });
          rows.push({
            qty: String(lmgMen),
            weapons: 'Infantry with Light Machine gun (requires loader)',
            ...lmgStats,
          });
        }

        if (flamethrowerMen > 0) {
          const ftStats = findUnitWeaponRow(def, /flamethrower/i, {
            range: '6"',
            shots: 'D6',
            pen: '+3',
            special: 'Team, Flamethrower',
          });
          rows.push({
            qty: String(flamethrowerMen),
            weapons: 'Infantry with Flamethrower (requires assistant)',
            ...ftStats,
          });
        }

        if (lightMortarMen > 0) {
          const lmStats = findUnitWeaponRow(def, /light mortar/i, {
            range: '12"-24"',
            shots: '1',
            pen: 'HE',
            special: 'Team, Indirect fire, HE (1")',
          });
          rows.push({
            qty: String(lightMortarMen),
            weapons: 'Infantry with Light mortar',
            ...lmStats,
          });
        }

        if (atRifleMen > 0) {
          const atrStats = findUnitWeaponRow(def, /anti-tank rifle/i, {
            range: '36"',
            shots: '1',
            pen: '+2',
            special: 'Team',
          });
          rows.push({
            qty: String(atRifleMen),
            weapons: 'Infantry with Anti-tank rifle',
            ...atrStats,
          });
        }

        rows.push(...extraRows);
        return { isVehicle: false, rows };
      }

      function ArmyRosterPrintView({ factionData, armyListName, armyNotes, totalPoints, totalOrderDice, platoons, isPreview = false }) {
        const platoonTypes = factionData?.platoons || [];
        const totalUnits = useMemo(() => platoons.reduce((acc, p) => acc + Object.keys(p.slots).length, 0), [platoons]);

        // Collect only the Special Rules that apply to the units & active options in the roster
        const armyActiveRules = useMemo(() => {
          const rules = [];
          const seen = new Set();
          platoons.forEach((p) => {
            Object.values(p.slots).forEach((u) => {
              if (!u || !u.name) return;
              const def = getUnitDefinition(factionData, u.name);
              const rosterTable = buildUnitRosterTable(def, u.config);

              const activeKeywords = new Set();
              if (def.specialRulesText && def.specialRulesText !== '-') {
                activeKeywords.add(def.specialRulesText.toLowerCase());
              }
              rosterTable.rows.forEach((r) => {
                if (r.special) activeKeywords.add(r.special.toLowerCase());
                if (r.weapons) activeKeywords.add(r.weapons.toLowerCase());
              });
              const joinedActive = [...activeKeywords].join(' | ');

              (def.unitRules || []).forEach((r) => {
                if (!r || !r.name || seen.has(r.name)) return;
                const rn = r.name.toLowerCase();
                if (
                  joinedActive.includes(rn) ||
                  (rn.includes('shaped charge') && joinedActive.includes('shaped charge')) ||
                  (rn.includes('one-shot') && joinedActive.includes('one-shot')) ||
                  (rn.includes('tank hunters') && joinedActive.includes('tank hunters')) ||
                  (rn.includes('team') && (joinedActive.includes('loader') || joinedActive.includes('assistant') || joinedActive.includes('team')))
                ) {
                  rules.push(r);
                  seen.add(r.name);
                }
              });
            });
          });
          return rules;
        }, [platoons, factionData]);

        const currentDateStr = new Date().toLocaleDateString('en-GB', {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });

        if (totalUnits === 0) {
          return (
            <div className="p-8 text-center text-zinc-500 font-mono text-xs">
              <p className="text-sm font-bold text-zinc-700 mb-1">Your army roster is currently empty.</p>
              <p>Select units in your platoon slots to preview or print the official roster.</p>
            </div>
          );
        }

        return (
          <div className={`w-full max-w-4xl mx-auto ${isPreview ? '' : 'bg-white text-zinc-900 font-sans'}`}>
            {/* ROSTER HEADER */}
            <div className="border-b-2 border-zinc-900 pb-3 mb-3 space-y-2">
              {/* Top Centered Logo + LIST MAKER */}
              <div className="flex items-center justify-center gap-2 pb-1">
                <span className="font-tactical font-black text-sm sm:text-base tracking-widest uppercase text-zinc-950 leading-none">
                  LIST
                </span>
                <HelmetLogo className="w-8 h-8 rounded-lg shadow-xs" />
                <span className="font-tactical font-black text-sm sm:text-base tracking-widest uppercase text-[#9A7B1C] leading-none">
                  MAKER
                </span>
              </div>

              {/* Bottom Header Row: Faction & List Name (Left) + Totals (Right) */}
              <div className="flex flex-wrap items-end justify-between gap-2">
                <div className="min-w-0">
                  <div className="text-[10px] font-mono font-bold uppercase tracking-wider text-zinc-600 truncate">
                    {factionData?.faction || 'Soviet Union'} • {factionData?.book || 'Bolt Action v3'}
                  </div>
                  <h1 className="text-base sm:text-xl font-black font-tactical tracking-wider text-zinc-950 uppercase truncate">
                    {armyListName || 'Untitled Force'}
                  </h1>
                </div>

                <div className="flex flex-wrap items-center gap-1.5 text-[10.5px] sm:text-xs font-mono font-bold">
                  <div className="bg-zinc-950 text-white px-2 py-1 rounded shadow-sm">
                    TOTAL: <span className="text-amber-400 font-black">{totalPoints} PTS</span>
                  </div>
                  <div className="bg-zinc-100 border border-zinc-300 text-zinc-800 px-2 py-1 rounded">
                    Dice: <span className="text-zinc-950 font-black">{totalOrderDice}</span>
                  </div>
                  <div className="bg-zinc-100 border border-zinc-300 text-zinc-800 px-2 py-1 rounded">
                    Platoons: <span className="text-zinc-950 font-black">{platoons.length}</span>
                  </div>
                </div>
              </div>
            </div>

            {armyNotes && armyNotes.trim() && (
              <div className="mb-3 p-2.5 bg-zinc-50 border border-zinc-200 rounded text-xs font-mono text-zinc-700">
                <span className="font-bold text-zinc-900 uppercase text-[10px] block mb-0.5">Force Notes:</span>
                <p className="whitespace-pre-line leading-relaxed text-justify" style={{ textAlign: 'justify' }}>{armyNotes}</p>
              </div>
            )}

            {/* PLATOONS */}
            <div className="space-y-4">
              {platoons.map((p) => {
                const pType = platoonTypes.find(t => t.id === p.typeId) || platoonTypes[0];
                const activeUnits = Object.entries(p.slots).filter(([_, u]) => u && u.name);
                if (activeUnits.length === 0) return null;

                const platoonPts = activeUnits.reduce((sum, [_, u]) => sum + (u.points || 0), 0);
                const platoonDice = activeUnits.length;
                return (
                  <div key={p.id} className="platoon-print-block">
                    <div className="bg-zinc-900 text-white px-2.5 py-1.5 rounded-t flex flex-wrap items-center justify-between gap-2 text-[11px] sm:text-xs font-mono font-bold tracking-wider uppercase mb-2">
                      <div className="flex items-center gap-1.5 min-w-0">

                        <span className="text-zinc-200 font-tactical font-black text-xs sm:text-sm tracking-wider truncate">{pType?.title}</span>
                        {p.period && p.period !== 'All' && (
                          <span className="text-[9.5px] px-1.5 py-0.2 bg-zinc-800 rounded text-amber-300 shrink-0">

                      {activeUnits.map(([slotId, unitItem]) => {
                        const def = getUnitDefinition(factionData, unitItem.name);
                        const summary = getUnitSummary(def, unitItem.config);
                        const rosterTable = buildUnitRosterTable(def, unitItem.config);
                        let slotName = slotId;
                        let matchedSlot = { id: slotId, label: slotId, slotKey: slotId };
                        for (const col of pType?.columns || []) {
                          const foundSlot = col.slots.find(s => s.id === slotId);
                          if (foundSlot) {
                            slotName = foundSlot.label;
                            matchedSlot = foundSlot;

                                <h3 className="font-bold font-sans text-sm text-zinc-950 tracking-tight">

                                  <span className="text-[11px] font-mono font-semibold text-zinc-600">
                                    ({summary.headCountText})

                                  {slotName}
                                </span>

                              <div className="flex items-center gap-3 shrink-0">
                                <span className="px-3 py-0.5 border border-zinc-800 rounded text-[11px] font-mono font-bold text-zinc-900 bg-white min-w-[82px] text-center shadow-2xs">
                                  {expLabel}
                                </span>
                                <span className="font-black text-sm font-mono text-zinc-950 min-w-[42px] text-right">
                                  {unitItem.points}
                                </span>
                              </div>
                            </div>

                            {/* UNIT INTEGRATED BREAKDOWN TABLE (Qty | Weapons | Range | Shots | Pen | Special) */}
                            <div className="px-3 py-1.5">
                              <table className="w-full text-[11px] text-left border-collapse">
                                <thead>
                                  <tr className="border-b border-zinc-200 text-zinc-600 font-bold text-[10.5px]">
                                    <th className="py-1 pr-2 w-10">Qty</th>
                                    <th className="py-1 pr-3">{rosterTable.isVehicle ? 'Vehicle / Weapons' : 'Weapons'}</th>
                                    <th className="py-1 px-2 text-center w-20">{rosterTable.isVehicle ? 'Type / Range' : 'Range'}</th>
                                    <th className="py-1 px-2 text-center w-16">{rosterTable.isVehicle ? 'Trans / Shots' : 'Shots'}</th>
                                    <th className="py-1 px-2 text-center w-14">{rosterTable.isVehicle ? 'DV / Pen' : 'Pen'}</th>
                                    <th className="py-1 pl-2 w-44">Special</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-zinc-200/70 font-mono text-[10.5px]">
                                  {rosterTable.rows.map((r, rIdx) => (
                                    <tr key={rIdx} className={r.isChassis ? 'bg-zinc-100/80 font-bold text-zinc-950' : 'text-zinc-800'}>
                                      <td className="py-1 pr-2 font-semibold text-zinc-900">{r.qty}</td>
                                      <td className={`py-1 pr-3 font-sans ${r.isChassis ? 'font-bold text-zinc-950' : 'text-zinc-900'}`}>
                                        {r.weapons}

                                      <td className="py-1 px-2 text-center text-zinc-800">{r.range}</td>
                                      <td className="py-1 px-2 text-center text-zinc-900 font-semibold">{r.shots}</td>
                                      <td className="py-1 px-2 text-center text-zinc-900 font-semibold">{r.pen}</td>
                                      <td className="py-1 pl-2 font-sans text-zinc-700">{r.special}</td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* UNIT SPECIAL RULES (COMPACT SINGLE-COLUMN LIST) */}
            {armyActiveRules.length > 0 && (
              <div className="rules-print-block mt-4 pt-2.5 border-t-2 border-zinc-800 break-inside-avoid">
                <h2 className="text-[11px] font-black font-tactical uppercase tracking-wider text-zinc-900 mb-1.5">
                  Unit Special Rules
                </h2>
                <div className="space-y-1 text-[9.5px] font-sans text-justify" style={{ textAlign: 'justify' }}>
                  {armyActiveRules.map((r, idx) => (
