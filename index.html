      const HelmetLogo = ({ className = "w-11 h-11" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" className={className} aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#161B15"/>

          <path d="M21 38.5 C21 47.5, 26 51, 32 51 C38 51, 43 47.5, 43 38.5" stroke="#C4A238" strokeWidth="2.4" strokeLinecap="round" fill="none"/>
          <path d="M29.5 51 H34.5" stroke="#7A7F52" strokeWidth="2.8" strokeLinecap="round"/>
          {/* Inner helmet brow opening / shadow */}
          <path d="M16 40 C21 43.5, 43 43.5, 48 40 C44 42.5, 20 42.5, 16 40 Z" fill="#161B15"/>
          {/* Helmet Shell (Symmetrical Front View) */}
          <path d="M12.5 38.5 C13 28, 17 14, 32 14 C47 14, 51 28, 51.5 38.5 C51.5 40.5, 48 42, 44 41 C37 39.5, 27 39.5, 20 41 C16 42, 12.5 40.5, 12.5 38.5 Z" fill="#DFBF52"/>
          {/* Visor / Brow Arch Line */}
          <path d="M14 37.5 C20 35.5, 44 35.5, 50 37.5" stroke="#20281E" strokeWidth="2" strokeLinecap="round"/>
          {/* Lower rim line */}
          <path d="M16 40.5 C23 39, 41 39, 48 40.5" stroke="#20281E" strokeWidth="1.2" strokeLinecap="round"/>
          {/* Symmetrical Crown Highlight Arch */}
          <path d="M22 26 C24 18.5, 28 16.5, 32 16.5 C36 16.5, 40 18.5, 42 26" stroke="#F4F1E8" strokeWidth="1.6" strokeLinecap="round" opacity="0.55"/>
          {/* Symmetrical Rivets / Air Vents */}
          <circle cx="18.5" cy="31.5" r="1.3" fill="#20281E"/>
          <circle cx="45.5" cy="31.5" r="1.3" fill="#20281E"/>
          {/* Tactical Red Star Emblem */}
          <polygon points="32,19.5 33.2,23.2 36.9,23.2 33.9,25.4 35,29.1 32,26.9 29,29.1 30.1,25.4 27.1,23.2 30.8,23.2" fill="#733028"/>
        </svg>
      );
      const DownloadIcon = ({ className = "w-4 h-4" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      );
      const EyeIcon = ({ className = "w-4 h-4" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      );
      const CloudIcon = ({ className = "w-4 h-4" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
        </svg>
      );
      const FolderIcon = ({ className = "w-4 h-4" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
        </svg>
      );
      const UserIcon = ({ className = "w-4 h-4" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
      );
      const LogOutIcon = ({ className = "w-4 h-4" }) => (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
        </svg>
      );

      // =========================================================================
      // ACCOUNTS & CLOUD / LOCAL LISTS (Google Sign-In + Supabase + Local Library)
      // =========================================================================
      const LOCAL_LISTS_KEY = 'boltaction.saved_lists.v1';
      const RUNTIME_SB_KEY = 'boltaction.supabase_config.v1';
      const LOCAL_USER_KEY = 'boltaction.local_user.v1';

      const DEFAULT_SUPABASE_URL = 'https://hllgymckihgmzlwkurid.supabase.co';
      const DEFAULT_SUPABASE_KEY = 'sb_publishable_QRIZ1T7JnqTKBbVcWegxEQ_9tsX0tiJ';

      function getEffectiveSupabaseConfig() {
        const winCfg = window.APP_CONFIG || {};
        let saved = null;
        try {
          saved = JSON.parse(localStorage.getItem(RUNTIME_SB_KEY) || 'null');
        } catch {}
        return {
          supabaseUrl: winCfg.supabaseUrl || saved?.supabaseUrl || DEFAULT_SUPABASE_URL,
          supabaseAnonKey: winCfg.supabaseAnonKey || saved?.supabaseAnonKey || DEFAULT_SUPABASE_KEY,
          googleClientId: winCfg.googleClientId || saved?.googleClientId || '',
        };
      }

      const initialSbCfg = getEffectiveSupabaseConfig();
      let supabaseClient =
        initialSbCfg.supabaseUrl && initialSbCfg.supabaseAnonKey && window.supabase
          ? window.supabase.createClient(initialSbCfg.supabaseUrl, initialSbCfg.supabaseAnonKey)
          : null;

      if (supabaseClient) {
        try {
          localStorage.removeItem(LOCAL_USER_KEY);
        } catch {}
      }

      function isSupabaseConfigured() {
        return !!supabaseClient;
      }

      function loadLocalUser() {
        if (supabaseClient) return null;
        try {
          return JSON.parse(localStorage.getItem(LOCAL_USER_KEY) || 'null');
        } catch {
          return null;
        }
      }

      function signInLocalUser(userObj) {
        try {
          localStorage.setItem(LOCAL_USER_KEY, JSON.stringify(userObj));
          window.dispatchEvent(new CustomEvent('boltaction-auth-change'));
        } catch {}
      }

      function signOutLocalUser() {
        try {
          localStorage.removeItem(LOCAL_USER_KEY);
          window.dispatchEvent(new CustomEvent('boltaction-auth-change'));
        } catch {}
      }

      function loadLocalLists() {
        try {
          const arr = JSON.parse(localStorage.getItem(LOCAL_LISTS_KEY) || '[]');
          return Array.isArray(arr) ? arr : [];
        } catch {
          return [];
        }
      }

      function saveLocalLists(lists) {
        try {
          localStorage.setItem(LOCAL_LISTS_KEY, JSON.stringify(lists));
        } catch {}
      }

      function useAuth() {
        const [session, setSession] = useState(null);
        const [localUser, setLocalUser] = useState(() => loadLocalUser());
        const [authReady, setAuthReady] = useState(!supabaseClient);

        useEffect(() => {
          const onLocalAuth = () => setLocalUser(loadLocalUser());
          window.addEventListener('boltaction-auth-change', onLocalAuth);
          if (!supabaseClient) {
            return () => window.removeEventListener('boltaction-auth-change', onLocalAuth);
          }
          supabaseClient.auth.getSession().then(({ data }) => {
            setSession(data.session);
            setAuthReady(true);
          });
          const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, s) => setSession(s));
          return () => {
            window.removeEventListener('boltaction-auth-change', onLocalAuth);
            sub.subscription.unsubscribe();
          };
        }, []);

        const activeUser = session?.user || localUser || null;
        return { session, user: activeUser, isCloudUser: !!session?.user, authReady };
      }

      function ModalShell({ title, subtitle, icon, onClose, children, maxWidth = "max-w-md" }) {
        return (
          <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4 bg-black/60 backdrop-blur-sm no-print">
            <div className={`bg-zinc-900 border border-zinc-700 rounded-t-2xl sm:rounded-2xl shadow-2xl w-full ${maxWidth} max-h-[92dvh] overflow-hidden flex flex-col`}>
              <div className="px-5 py-3.5 bg-zinc-950 border-b border-zinc-800 flex items-center justify-between gap-4 shrink-0">
                <div className="flex items-center gap-3 min-w-0">
                  <div className="w-8 h-8 rounded-lg bg-amber-400/15 border border-amber-400/30 flex items-center justify-center text-amber-400 shrink-0">
                    {icon}
                  </div>
                  <div className="min-w-0">
                    <h2 className="text-base font-black font-tactical text-white tracking-wide uppercase truncate">{title}</h2>
                    {subtitle && <p className="text-[11px] font-mono text-zinc-400 truncate">{subtitle}</p>}
                  </div>
                </div>
                <button
                  type="button"
                  onClick={onClose}
                  className="p-2 rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors cursor-pointer"
                  title="Close"
                >
                  <XIcon className="w-5 h-5" />
                </button>
              </div>
              <div className="flex-1 overflow-y-auto p-5 safe-bottom">{children}</div>
            </div>
          </div>
        );
      }

      function AuthModal({ isOpen, onClose }) {
        const [mode, setMode] = useState('signin'); // signin | signup | reset | google_quick | config
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [googleEmail, setGoogleEmail] = useState('');
        const [googleName, setGoogleName] = useState('');
        const [busy, setBusy] = useState(false);
        const [message, setMessage] = useState(null);
        const [sbUrl, setSbUrl] = useState(initialSbCfg.supabaseUrl || '');
        const [sbKey, setSbKey] = useState(initialSbCfg.supabaseAnonKey || '');
        const [gClientId, setGClientId] = useState(initialSbCfg.googleClientId || '');

        useEffect(() => {
          if (isOpen) {
            setMessage(null);
            if (mode === 'config' || mode === 'google_quick') setMode('signin');
          }
        }, [isOpen]);

        if (!isOpen) return null;

        const redirectTo = window.location.origin + window.location.pathname;

        const handleSaveConfig = (e) => {
          e.preventDefault();
          localStorage.setItem(
            RUNTIME_SB_KEY,
            JSON.stringify({
              supabaseUrl: sbUrl.trim(),
              supabaseAnonKey: sbKey.trim(),
              googleClientId: gClientId.trim(),
            })
          );
          window.location.reload();
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          setBusy(true);
          setMessage(null);
          try {
            if (supabaseClient) {
              if (mode === 'signin') {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                onClose();
              } else if (mode === 'signup') {
                const { data, error } = await supabaseClient.auth.signUp({
                  email,
                  password,
                  options: { emailRedirectTo: redirectTo },
                });
                if (error) throw error;
                if (data.session) {
                  onClose();
                } else {
                  setMessage({ type: 'success', text: 'Account created. Check your email to confirm it, then sign in.' });
                  setMode('signin');
                }
              } else {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });
                if (error) throw error;
                setMessage({ type: 'success', text: 'Password reset email sent.' });
              }
            } else {
              // Instant account sign-in
              const cleanEmail = email.trim().toLowerCase();
              if (!cleanEmail) throw new Error('Please enter your email.');
              if (mode === 'reset') {
                setMessage({ type: 'success', text: 'You can sign in directly with a new password.' });
                setMode('signin');
              } else {
                signInLocalUser({
                  id: `user-${cleanEmail}`,
                  email: cleanEmail,
                  provider: 'email',
                });
                onClose();
              }
            }
          } catch (err) {
            setMessage({ type: 'error', text: err.message || String(err) });
          } finally {
            setBusy(false);
          }
        };

        const handleGoogle = async () => {
          setMessage(null);
          // 1. If Supabase Cloud is connected, use Supabase Google OAuth
          if (supabaseClient) {
            const { error } = await supabaseClient.auth.signInWithOAuth({
              provider: 'google',
              options: { redirectTo },
            });
            if (error) setMessage({ type: 'error', text: error.message });
            return;
          }

          // 2. If Google OAuth Client ID is configured, open native Google Account Chooser popup
          const activeGoogleClientId = gClientId.trim() || initialSbCfg.googleClientId;
          if (activeGoogleClientId && window.google?.accounts?.oauth2) {
            try {
              const tokenClient = window.google.accounts.oauth2.initTokenClient({
                client_id: activeGoogleClientId,
                scope: 'openid email profile',
                callback: async (resp) => {
                  if (resp.error) {
                    setMessage({ type: 'error', text: resp.error_description || resp.error });
                    return;
                  }
                  try {
                    const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                      headers: { Authorization: `Bearer ${resp.access_token}` },
                    });
                    const profile = await r.json();
                    signInLocalUser({
                      id: `google-${profile.sub || profile.email}`,
                      email: profile.email,
                      name: profile.name,
                      picture: profile.picture,
                      provider: 'google',
                    });
                    onClose();
                  } catch (fetchErr) {
                    setMessage({ type: 'error', text: 'Failed to read Google profile.' });
                  }
                },
              });
              tokenClient.requestAccessToken({ prompt: 'select_account' });
              return;
            } catch (gErr) {
              setMessage({ type: 'error', text: gErr.message || String(gErr) });
              return;
            }
          }

          // 3. Instant Google Account Sign-In modal step
          setMode('google_quick');
        };

        const handleQuickGoogleSubmit = (e) => {
          e.preventDefault();
          let clean = googleEmail.trim().toLowerCase();
          if (!clean) return;
          if (!clean.includes('@')) clean = `${clean}@gmail.com`;
          signInLocalUser({
            id: `google-${clean}`,
            email: clean,
            name: googleName.trim() || clean.split('@')[0],
            provider: 'google',
          });
          onClose();
        };

        const titles = {
          signin: 'Sign In',
          signup: 'Create Account',
          reset: 'Reset Password',
          google_quick: 'Sign in with Google',
          config: 'OAuth & Cloud Settings',
        };
        const inputCls =
          "w-full bg-zinc-950 border border-zinc-700 focus:border-amber-400 rounded-lg px-3 py-2.5 text-sm text-white font-mono placeholder-zinc-600 outline-none transition-colors";

        return (
          <ModalShell
            title={titles[mode] || 'Sign In'}
            subtitle="Save & access your Bolt Action army lists"
            icon={<UserIcon className="w-4 h-4" />}
            onClose={onClose}
          >
            {mode === 'google_quick' ? (
              <form onSubmit={handleQuickGoogleSubmit} className="space-y-4">

      // =========================================================================

      const FACTIONS_REGISTRY = window.EASYARMY_FACTIONS || {

      // Backward-compatibility alias map for any legacy saved JSON lists
      const LEGACY_UNIT_ALIASES = {

      function getUnitDefinition(factionData, unitName) {
        const canonical = LEGACY_UNIT_ALIASES[unitName] || unitName;
        const units = factionData?.units || {};
        const entry = units[canonical] || units[unitName];
        if (entry) return entry;
        return {
          name: unitName,
          cardTitle: unitName,
          page: factionData?.book || "Bolt Action v3",
          period: "E/M/L",
          image: null,
          profile: {},
          composition: "1 Unit",
          weapons: "Standard",
          damageValue: null,
          specialRulesText: "-",
          costs: { regular: { points: 50 } },
          defaultExp: "regular",
          maxExtraMen: 0,
          optionsList: [],
          weaponsTable: [],
          weaponNotes: [],
          unitRules: [],
        };
      }

      function getUnitBaseMen(def) {
        if (!def) return 0;
        if (def.damageValue) return 0;
        const comp = (def.composition || "").toLowerCase();
        if (!comp || comp.includes("vehicle")) return 0;

        const ncoMatch = comp.match(/(\d+)\s*nco.*?(\d+)\s*men/i);
        if (ncoMatch) {
          return parseInt(ncoMatch[1], 10) + parseInt(ncoMatch[2], 10);
        }
        const menMatch = comp.match(/(\d+)\s*(men|handlers)/i);
        if (menMatch) {
          return parseInt(menMatch[1], 10);
        }

        if (comp.includes("officer") || comp.includes("commander") || comp.includes("commissar") || comp.includes("medic") || comp.includes("observer")) {
          let count = 1;
          const extraMatch = comp.match(/and\s*(\d+)\s*men/i);
          if (extraMatch) count += parseInt(extraMatch[1], 10);
          return count;
        }
        return 1;
      }

      function calculateUnitPoints(def, config) {
        if (!def || !config) return 0;
        const expData = def.costs[config.experience] || Object.values(def.costs)[0] || { points: 0 };
        let points = expData.points || 0;
        const extraMen = Number(config.extraMen || 0);
        if (extraMen > 0 && def.maxExtraMen > 0) {
          const costPerMan = expData.extraCost ?? 10;
          points += extraMen * costPerMan;
        }
        let extraPersonnel = 0;
        if (config.options?.extra_crew) extraPersonnel += 1;
        if (config.options?.spotter) extraPersonnel += 1;
        const totalMenCount = getUnitBaseMen(def) + extraMen + extraPersonnel;

        if (config.options && def.optionsList) {
          def.optionsList.forEach(opt => {
            if (opt.id === 'extra_men') return;
            const val = config.options[opt.id];
            if (!val) return;

            if (opt.type === "checkbox") {
              points += opt.cost || 0;
            } else if (opt.type === "counter") {
              points += Number(val) * (opt.cost || 0);
            } else if (opt.type === "per_man") {
              points += totalMenCount * (opt.costPerMan || 0);
            }
          });
        }

        return points;
      }
      function getUnitSummary(def, config) {
        if (!def) return null;
        const options = config?.options || {};
        const extraMen = Number(config?.extraMen || 0);
        const hasVehicleRows = (def.weaponsTable || []).some((w) => w.rowType === 'vehicle_stat');
        const isVehicle = !!def.damageValue || hasVehicleRows;
        const baseMen = getUnitBaseMen(def);

        let extraPersonnel = 0;
        if (options.extra_crew) extraPersonnel += 1;
        if (options.spotter) extraPersonnel += 1;
        const totalModels = isVehicle ? 1 : baseMen + extraMen + extraPersonnel;
        // Collect active option descriptions with their point costs
        const selectedOptions = [];
        const expKey = config?.experience || def.defaultExp || 'regular';
        const expData = def.costs[expKey] || Object.values(def.costs)[0] || { points: 0 };

        if (extraMen > 0 && def.maxExtraMen > 0) {
          const costPerMan = expData.extraCost ?? 10;
          selectedOptions.push({
            id: 'extra_men',
            text: `+${extraMen} additional sold (@ +${costPerMan}pts each)`,
            points: extraMen * costPerMan,
          });
        }
        for (const opt of def.optionsList || []) {
          if (opt.id === 'extra_men') continue;
          const val = options[opt.id];
          if (!val) continue;

          if (opt.type === 'counter') {
            const count = Number(val);
            const pts = count * (opt.cost || 0);
            selectedOptions.push({
              id: opt.id,
              text: `${count}× ${opt.rawText || opt.label}`,
              points: pts,
            });
          } else if (opt.type === 'per_man') {
            const pts = totalModels * (opt.costPerMan || 0);
            selectedOptions.push({
              id: opt.id,
              text: `${opt.rawText || opt.label} (${totalModels} sold)`,
              points: pts,
            });
          } else {
            selectedOptions.push({
              id: opt.id,
              text: opt.rawText || opt.label,
              points: opt.cost || 0,
            });
          }
        }

        const headCountText = isVehicle
          ? '1 veh'
          : totalModels > 0
          ? `${totalModels} sold`
          : def.composition;

        const compositionSummary = isVehicle
          ? '1 veh'
          : extraMen > 0
          ? `${def.composition} + ${extraMen} (${totalModels} sold)`
          : `${def.composition} (${totalModels} sold)`;

        return {
          isVehicle,
          baseMen,
          totalModels,
          headCountText,
          compositionSummary,
          selectedOptions,
        };
      }

      function formatPtsDelta(pts) {
        if (pts > 0) return `+${pts} pts`;
        if (pts < 0) return `${pts} pts`;
        return `0 pts`;
      }

      // =========================================================================
      // FULL-WINDOW UNIT CONFIGURATION MODAL (EasyArmy Two-Column Layout)
      // Left: Experience, Profile, Verbatim Options, Weapon Table, Special Rules
      // Right: Large Unit Illustration + Live Cost Breakdown
      // =========================================================================
      function UnitEditModal({ isOpen, onClose, factionData, unitItem, slotLabel, onSave, onClearUnit }) {
        if (!isOpen || !unitItem) return null;

        const def = useMemo(() => getUnitDefinition(factionData, unitItem.name), [factionData, unitItem.name]);

        const [experience, setExperience] = useState(unitItem.config?.experience || def.defaultExp || "regular");
        const [extraMen, setExtraMen] = useState(unitItem.config?.extraMen || 0);
        const [options, setOptions] = useState(unitItem.config?.options || {});

        useEffect(() => {
          setExperience(unitItem.config?.experience || def.defaultExp || "regular");
          setExtraMen(unitItem.config?.extraMen || 0);
          setOptions(unitItem.config?.options || {});
        }, [unitItem, def]);

        const currentConfig = useMemo(() => ({
          experience,
          extraMen,
          options
        }), [experience, extraMen, options]);

        const calculatedPoints = useMemo(
          () => calculateUnitPoints(def, currentConfig),
          [def, currentConfig]
        );
        const summary = useMemo(
          () => getUnitSummary(def, currentConfig),
          [def, currentConfig]
        );

        const handleOptionToggle = (optId, checked) => {
          setOptions(prev => ({ ...prev, [optId]: checked }));
        };

        const handleOptionCount = (optId, count) => {
          setOptions(prev => ({ ...prev, [optId]: count }));
        };

        const handleSave = () => {
          onSave({
            name: def.name,
            points: calculatedPoints,
            config: {
              experience,
              extraMen,
              options
            }
          });
          onClose();
        };
        const totalModels = summary?.totalModels || getUnitBaseMen(def) + extraMen;
        const costPerMan = def.costs[experience]?.extraCost ?? 10;

        // Group options by EasyArmy's original group headings
        const groupedOptions = useMemo(() => {
          const groups = [];
          const map = new Map();
          for (const opt of def.optionsList || []) {
            if (opt.id === 'extra_men') continue;
            const grpKey = opt.group || 'Options';
            if (!map.has(grpKey)) {
              const g = { title: grpKey, items: [] };
              map.set(grpKey, g);
              groups.push(g);
            }
            map.get(grpKey).items.push(opt);
          }
          return groups;
        }, [def]);
        const profileEntries = useMemo(() => {
          return Object.entries(def.profile || {});
        }, [def]);
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-0 sm:p-4 bg-black/60 backdrop-blur-sm animate-in fade-in duration-100 no-print">
            <div className="bg-zinc-900 border-0 sm:border border-zinc-700 rounded-none sm:rounded-2xl shadow-2xl w-full sm:w-[96vw] max-w-[1440px] h-[100dvh] sm:h-[92dvh] overflow-hidden flex flex-col">
              {/* TOP HEADER BAR */}
              <div className="px-3.5 sm:px-5 py-2.5 sm:py-3.5 bg-zinc-950 border-b border-zinc-800 flex items-center justify-between gap-2 shrink-0 safe-top">
                <div className="min-w-0 flex items-center gap-2 flex-wrap">
                  <h2 className="text-base sm:text-xl font-black font-tactical text-white tracking-wide uppercase truncate">
                    {def.cardTitle || def.name}
                  </h2>
                  {summary?.headCountText && (
                    <span className="px-2 py-0.5 rounded bg-zinc-800 border border-zinc-700 text-amber-300 font-mono text-xs font-bold">
                      {summary.headCountText}
                    </span>
                  )}
                  {slotLabel && (
                    <span className="px-2 py-0.5 rounded bg-zinc-800 border border-zinc-700 text-zinc-300 font-mono text-[11px] font-semibold">
                      {slotLabel}
                    </span>
                  )}
                  {def.period && (
                    <span className="hidden sm:inline px-2 py-0.5 rounded bg-amber-400/10 border border-amber-400/30 text-amber-300 font-mono text-xs font-bold">
                      Period: {def.period}
                    </span>
                  )}
                </div>

                <div className="flex items-center gap-2 shrink-0">

                  <div className="bg-amber-400 text-black px-2.5 sm:px-3.5 py-1 rounded-lg font-black font-mono text-xs sm:text-sm shadow">
                    {calculatedPoints} pts
                  </div>

                  <button
                    type="button"
                    onClick={handleSave}
                    className="hidden sm:inline-flex px-4 py-1.5 rounded-lg bg-[#7A7F52] hover:bg-[#8A8F5E] text-[#E7E1CF] border border-[#B2A77A]/40 font-extrabold text-xs font-mono transition-colors shadow cursor-pointer"
                  >
                    Save Unit
                  </button>

                  <button
                    type="button"
                    onClick={onClose}
                    className="p-1.5 rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors cursor-pointer"
                    title="Close"
                  >
                    <XIcon className="w-5 h-5" />
                  </button>
                </div>
              </div>
              {/* MAIN TWO-COLUMN BODY (EasyArmy Official Layout) */}
              <div className="flex-1 overflow-y-auto p-3 sm:p-6">
                {/* COMPACT MOBILE / PORTRAIT-TABLET ILLUSTRATION BANNER */}
                {def.image && (
                  <div className="lg:hidden mb-4 bg-white rounded-xl p-3 border-2 border-zinc-700 flex items-center justify-center max-h-48 overflow-hidden shadow">
                    <img src={`./${def.image}`} alt={def.name} className="max-h-40 w-auto object-contain" />
                  </div>
                )}
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 sm:gap-6 items-start">
                  {/* LEFT COLUMN (7/12): COST, UNIT PROFILE, OPTIONS, WEAPONS TABLE, SPECIAL RULES */}
                  <div className="lg:col-span-7 space-y-4 sm:space-y-5">

                    {/* 1. COST / EXPERIENCE SELECTOR */}
                    <div className="bg-zinc-950/90 border border-zinc-800 rounded-xl p-4 space-y-2.5">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-tactical font-bold uppercase tracking-wider text-amber-400">
                          Cost / Experience Level
                        </span>
                        <span className="text-[11px] font-mono text-zinc-400">
                          Select unit rating
                        </span>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        {Object.entries(def.costs).map(([expKey, data]) => {
                          const isSelected = experience === expKey;
                          const expLabel = EXP_LABELS[expKey] || expKey;
                          return (
                            <button
                              key={expKey}
                              type="button"
                              onClick={() => setExperience(expKey)}
                              className={`py-2.5 px-3 rounded-lg text-xs font-mono font-bold transition-all flex items-center justify-between border cursor-pointer ${
                                isSelected
                                  ? 'bg-amber-400 text-black border-amber-300 font-black shadow-md'
                                  : 'bg-zinc-900 text-zinc-300 border-zinc-800 hover:border-zinc-700 hover:text-white'
                              }`}
                            >
                              <span>{expLabel}</span>
                              <span className={`px-2 py-0.5 rounded text-xs ${isSelected ? 'bg-black/15 text-black font-black' : 'bg-zinc-800 text-amber-400'}`}>
                                {data.points} pts
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                    {/* 2. UNIT PROFILE (Exact EasyArmy Fields) */}
                    {profileEntries.length > 0 && (
                      <div className="bg-zinc-950/90 border border-zinc-800 rounded-xl p-4 space-y-2">
                        <div className="text-xs font-tactical font-bold uppercase tracking-wider text-amber-400 border-b border-zinc-800/80 pb-1.5">
                          Unit Profile
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-2 text-xs font-mono pt-1">
                          {profileEntries.map(([k, v]) => (
                            <div key={k} className={k === 'Special Rules' || k === 'Transport' || k === 'Tow' ? 'sm:col-span-2' : ''}>
                              <span className="text-zinc-400 font-semibold">{k}: </span>
                              <span className="text-zinc-100 whitespace-pre-line">{v}</span>
                            </div>
                          ))}
                          {def.notes && (
                            <div className="sm:col-span-2 pt-1.5 border-t border-zinc-800/60 text-zinc-400 italic text-[11px]">
                              {def.notes}
                            </div>
                          )}
                        </div>
                      </div>
                    )}
                    {/* 3. OPTIONS (Verbatim EasyArmy Groups & Option Texts) */}
                    <div className="bg-zinc-950/90 border border-zinc-800 rounded-xl p-4 space-y-4">
                      <div className="flex items-center justify-between border-b border-zinc-800/80 pb-2">
                        <span className="text-xs font-tactical font-bold uppercase tracking-wider text-amber-400">
                          Options
                        </span>
                        <span className="text-[11px] font-mono text-zinc-400">
                          Official EasyArmy unit configuration
                        </span>
                      </div>

                      {/* Additional Men Control (when unit supports adding models) */}
                      {def.maxExtraMen > 0 && (
                        <div className="p-3 rounded-lg bg-zinc-900/90 border border-zinc-800 space-y-2">
                          <div className="text-[11px] font-mono font-bold text-amber-300/90">
                            {def.extraMenGroupText || `Add up to ${def.maxExtraMen} men:`}
                          </div>
                          <div className="flex items-center justify-between gap-3">
                            <label className="flex items-center gap-2.5 cursor-pointer select-none min-w-0">
                              <input
                                type="checkbox"
                                checked={extraMen > 0}
                                onChange={(e) => setExtraMen(e.target.checked ? 1 : 0)}
                                className="w-4 h-4 rounded bg-zinc-800 border-zinc-600 text-amber-500 focus:ring-0 cursor-pointer shrink-0"
                              />
                              <span className={`text-xs font-mono ${extraMen > 0 ? 'text-amber-300 font-bold' : 'text-zinc-200'}`}>
                                +{costPerMan}pts each ({EXP_LABELS[experience] || experience}) — up to {def.maxExtraMen} men
                              </span>
                            </label>
                            <div className="flex items-center gap-2.5 shrink-0">
                              <div className="flex items-center gap-1 bg-zinc-950 border border-zinc-700 rounded-lg px-1.5 py-0.5">
                                <button
                                  type="button"
                                  onClick={() => setExtraMen(Math.max(0, extraMen - 1))}
                                  className="px-2 py-0.5 text-zinc-400 hover:text-white font-mono font-bold text-xs cursor-pointer"
                                >
                                  −
                                </button>
                                <select
                                  value={extraMen}
                                  onChange={(e) => setExtraMen(Number(e.target.value))}
                                  className="bg-transparent text-amber-300 font-mono font-bold text-xs focus:outline-none text-center cursor-pointer"
                                >
                                  <option value={0} className="bg-zinc-900 text-zinc-400">0</option>
                                  {Array.from({ length: def.maxExtraMen }, (_, i) => i + 1).map(num => (
                                    <option key={num} value={num} className="bg-zinc-900 text-amber-300">+{num}</option>
                                  ))}
                                </select>
                                <button
                                  type="button"
                                  onClick={() => setExtraMen(Math.min(def.maxExtraMen, extraMen + 1))}
                                  className="px-2 py-0.5 text-zinc-400 hover:text-white font-mono font-bold text-xs cursor-pointer"
                                >
                                  +
                                </button>
                              </div>
                              <span className="text-amber-400 font-mono text-xs font-bold w-20 text-right">
                                {formatPtsDelta(extraMen > 0 ? extraMen * costPerMan : costPerMan)}
                              </span>
                            </div>
                          </div>
                        </div>
                      )}
                      {/* Grouped Options */}
                      {groupedOptions.map((grp, gIdx) => (
                        <div key={gIdx} className="space-y-1.5">
                          {grp.title && grp.title !== 'Options' && grp.title !== 'Options:' && (
                            <div className="text-[11px] font-mono font-bold text-amber-300/90 pt-1">
                              {grp.title}
                            </div>
                          )}

                          <div className="divide-y divide-zinc-800/60 border border-zinc-800/80 rounded-lg bg-zinc-900/50 overflow-hidden">
                            {grp.items.map((opt) => {
                              const displayLabel = opt.rawText || opt.label;

                              if (opt.type === "counter") {
                                const val = Number(options[opt.id] || 0);
                                const isChecked = val > 0;
                                const maxAllowed = opt.max || 1;
                                return (
                                  <div key={opt.id} className="flex items-center justify-between py-2.5 px-3 hover:bg-zinc-800/40 transition-colors gap-3">
                                    <label className="flex items-center gap-2.5 cursor-pointer min-w-0 select-none">
                                      <input
                                        type="checkbox"
                                        checked={isChecked}
                                        onChange={(e) => handleOptionCount(opt.id, e.target.checked ? 1 : 0)}
                                        className="w-4 h-4 rounded bg-zinc-800 border-zinc-600 text-amber-500 focus:ring-0 cursor-pointer shrink-0"
                                      />
                                      <span className={`text-xs font-mono leading-snug ${isChecked ? 'text-amber-300 font-semibold' : 'text-zinc-200'}`}>
                                        {displayLabel}
                                      </span>
                                    </label>

                                    <div className="flex items-center gap-2.5 shrink-0">
                                      <div className="flex items-center gap-1 bg-zinc-950 border border-zinc-700 rounded-lg px-1.5 py-0.5">
                                        <button
                                          type="button"
                                          onClick={() => handleOptionCount(opt.id, Math.max(0, val - 1))}
                                          className="px-1.5 py-0.5 text-zinc-400 hover:text-white font-mono font-bold text-xs cursor-pointer"
                                        >
                                          −
                                        </button>
                                        <select
                                          value={val}
                                          onChange={(e) => handleOptionCount(opt.id, Number(e.target.value))}
                                          className="bg-transparent text-amber-300 font-mono font-bold text-xs focus:outline-none text-center cursor-pointer"
                                        >
                                          <option value={0} className="bg-zinc-900 text-zinc-400">0</option>
                                          {Array.from({ length: maxAllowed }, (_, i) => i + 1).map(num => (
                                            <option key={num} value={num} className="bg-zinc-900 text-amber-300">{num}</option>
                                          ))}
                                        </select>
                                        <button
                                          type="button"
                                          onClick={() => handleOptionCount(opt.id, Math.min(maxAllowed, val + 1))}
                                          className="px-1.5 py-0.5 text-zinc-400 hover:text-white font-mono font-bold text-xs cursor-pointer"
                                        >
                                          +
                                        </button>
                                      </div>

                                      <span className="text-amber-400 font-mono text-xs font-bold w-20 text-right">
                                        {formatPtsDelta(val > 0 ? val * opt.cost : opt.cost)}
                                      </span>
                                    </div>
                                  </div>
                                );
                              }

                              if (opt.type === "per_man") {
                                const isChecked = !!options[opt.id];
                                const cost = totalModels * (opt.costPerMan || 0);
                                return (
                                  <div key={opt.id} className="flex items-center justify-between py-2.5 px-3 hover:bg-zinc-800/40 transition-colors gap-3">
                                    <label className="flex items-center gap-2.5 cursor-pointer min-w-0 select-none">
                                      <input
                                        type="checkbox"
                                        checked={isChecked}
                                        onChange={(e) => handleOptionToggle(opt.id, e.target.checked)}
                                        className="w-4 h-4 rounded bg-zinc-800 border-zinc-600 text-amber-500 focus:ring-0 cursor-pointer shrink-0"
                                      />
                                      <span className={`text-xs font-mono leading-snug ${isChecked ? 'text-amber-300 font-semibold' : 'text-zinc-200'}`}>
                                        {displayLabel}
                                      </span>
                                    </label>
                                    <span className="text-amber-400 font-mono text-xs font-bold w-20 text-right shrink-0">
                                      {formatPtsDelta(cost)}
                                    </span>
                                  </div>
                                );
                              }

                              const isChecked = !!options[opt.id];
                              return (
                                <div key={opt.id} className="flex items-center justify-between py-2.5 px-3 hover:bg-zinc-800/40 transition-colors gap-3">
                                  <label className="flex items-center gap-2.5 cursor-pointer min-w-0 select-none">
                                    <input
                                      type="checkbox"
                                      checked={isChecked}
                                      onChange={(e) => handleOptionToggle(opt.id, e.target.checked)}
                                      className="w-4 h-4 rounded bg-zinc-800 border-zinc-600 text-amber-500 focus:ring-0 cursor-pointer shrink-0"
                                    />
                                    <span className={`text-xs font-mono leading-snug ${isChecked ? 'text-amber-300 font-semibold' : 'text-zinc-200'}`}>
                                      {displayLabel}
                                    </span>
                                  </label>
                                  <span className="text-amber-400 font-mono text-xs font-bold w-20 text-right shrink-0">
                                    {formatPtsDelta(opt.cost || 0)}
                                  </span>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      ))}
                      {groupedOptions.length === 0 && def.maxExtraMen === 0 && (
                        <div className="text-zinc-500 text-xs font-mono italic py-3 text-center">
                          No additional options for this unit.
                        </div>
                      )}
                    </div>

                    {/* 4. WEAPONS TABLE (Official EasyArmy Weapon Chart) */}
                    {((def.weaponsTable && def.weaponsTable.length > 0) || (def.weaponNotes && def.weaponNotes.length > 0)) && (() => {
                      const hasVehicleStats = (def.weaponsTable || []).some(w => w.rowType === 'vehicle_stat');
                      const weaponRowsCount = (def.weaponsTable || []).filter(w => w.rowType !== 'vehicle_stat').length || (def.weaponsTable?.length || 0);
                      return (
                        <div className="bg-zinc-950/90 border border-zinc-800 rounded-xl p-4 space-y-2.5">
                          <div className="flex items-center justify-between border-b border-zinc-800/80 pb-1.5">
                            <span className="text-xs font-tactical font-bold uppercase tracking-wider text-amber-400">
                              {hasVehicleStats ? `Vehicle & Weapons (${weaponRowsCount})` : `Weapons (${weaponRowsCount})`}
                            </span>
                            {def.damageValue && (
                              <span className="text-xs font-mono text-zinc-400">
                                Damage Value: <strong className="text-zinc-100">{def.damageValue}</strong>
                              </span>
                            )}
                          </div>

                          {def.weaponsTable && def.weaponsTable.length > 0 && (
                            <div className="overflow-x-auto">
                              <table className="w-full text-xs text-left border-collapse font-mono">
                                <thead>
                                  <tr className="text-zinc-400 border-b border-zinc-800 text-[10.5px] uppercase">
                                    <th className="py-1.5 pr-2 font-semibold">{hasVehicleStats ? 'Vehicle / Weapons' : 'Weapons'}</th>
                                    <th className="py-1.5 px-2 font-semibold text-center">{hasVehicleStats ? 'Type / Range' : 'Range'}</th>
                                    <th className="py-1.5 px-2 font-semibold text-center">{hasVehicleStats ? 'Trans / Shots' : 'Shots'}</th>
                                    <th className="py-1.5 px-2 font-semibold text-center">{hasVehicleStats ? 'DV / Pen' : 'Pen'}</th>
                                    <th className="py-1.5 pl-2 font-semibold">Special</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-zinc-800/50 text-[11px]">
                                  {def.weaponsTable.map((w, idx) => {
                                    if (w.rowType === 'vehicle_stat') {
                                      return (
                                        <tr key={idx} className="bg-zinc-900/90 border-t border-zinc-700/80 text-amber-300">
                                          <td className="py-1.5 px-2 font-bold text-amber-300">
                                            <span>{w.name}</span>
                                            <span className="ml-1.5 px-1.5 py-0.2 rounded bg-amber-400/15 border border-amber-400/30 text-[9.5px] uppercase tracking-wider text-amber-200">
                                              Chassis
                                            </span>
                                          </td>
                                          <td className="py-1.5 px-2 text-center font-semibold text-zinc-200">{w.range}</td>
                                          <td className="py-1.5 px-2 text-center text-zinc-300">{w.shots}</td>
                                          <td className="py-1.5 px-2 text-center font-black text-amber-300">{w.pen}</td>
                                          <td className="py-1.5 pl-2 text-zinc-300 italic">{w.special}</td>
                                        </tr>
                                      );
                                    }
                                    return (
                                      <tr key={idx} className="text-zinc-200 hover:bg-zinc-900/50">
                                        <td className={`py-1.5 pr-2 font-semibold text-white ${hasVehicleStats ? 'pl-2.5' : ''}`}>
                                          {hasVehicleStats ? `↳ ${w.name}` : w.name}
                                        </td>
                                        <td className="py-1.5 px-2 text-center text-zinc-300">{w.range}</td>
                                        <td className="py-1.5 px-2 text-center font-bold text-amber-300">{w.shots}</td>
                                        <td className="py-1.5 px-2 text-center font-bold text-amber-400">{w.pen}</td>
                                        <td className="py-1.5 pl-2 text-zinc-300">{w.special}</td>
                                      </tr>
                                    );
                                  })}
                                </tbody>
                              </table>
                            </div>
                          )}
                          {def.weaponNotes && def.weaponNotes.length > 0 && (
                            <div className="pt-2 border-t border-zinc-800/60 space-y-1 text-[11px] font-mono text-zinc-400">
                              {def.weaponNotes.map((wn, idx) => (
                                <div key={idx}>• {wn}</div>
                              ))}
                            </div>
                          )}
                        </div>
                      );
                    })()}
                    {/* 5. UNIT SPECIAL RULES (Official EasyArmy Rule Descriptions) */}
                    {def.unitRules && def.unitRules.length > 0 && (
                      <div className="bg-zinc-950/90 border border-zinc-800 rounded-xl p-4 space-y-2.5">
                        <div className="text-xs font-tactical font-bold uppercase tracking-wider text-amber-400 border-b border-zinc-800/80 pb-1.5">

                        <span className="text-zinc-400 text-[11px]">

                        </span>

                      <div className="space-y-1.5 text-[11.5px]">
                        <div className="flex items-center justify-between text-zinc-300">

                    </div>

                  </div>

                </div>

              {/* BOTTOM FOOTER BAR */}

                  type="button"

                    onClearUnit();
                    onClose();

                  className="px-3 py-2 sm:py-1.5 rounded-lg bg-red-950/50 hover:bg-red-900/70 border border-red-800/60 text-red-300 text-xs font-mono font-semibold transition-colors cursor-pointer"

                  Remove
                </button>

                <div className="flex items-center gap-2 sm:gap-3">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-3.5 py-2 sm:py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-mono font-semibold transition-colors border border-zinc-700 cursor-pointer"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={handleSave}
                    className="px-5 py-1.5 rounded-lg bg-amber-400 hover:bg-amber-300 text-black font-black text-xs font-mono transition-colors shadow cursor-pointer"
                  >
                    Save Unit ({calculatedPoints} pts)
                  </button>
                </div>
              </div>

            </div>
          </div>
        );
      }
      // =========================================================================
      // TACTICAL UNIT ICON (Bolt Action v3 Official NATO-Style Symbols)
      // =========================================================================
      function resolveTacticalIconType(slot, unitName, platoonTypeId) {
        const key = ((slot?.slotKey || slot?.label || '') + '').toLowerCase();
        const uName = ((unitName || '') + '').toLowerCase();

        if (key.includes('command vehicle') || key.includes('cmd vehicle') || key.includes('recce vehicles rule')) {
          return { type: 'armoured_hq', dots: 1 };
        }
        if (key.includes('commander') || key.includes('commissar') || key.includes('hq') || key.includes('officer')) {
          if (platoonTypeId === 'armoured') return { type: 'armoured_hq', dots: 1 };
          return { type: 'hq', dots: 1 };
        }
        if (key.includes('engineer')) {
          return { type: 'engineer', dots: 2 };
        }
        if (key.includes('infantry') || key.includes('squad')) {
          return { type: 'infantry', dots: 2 };
        }
        if (key.includes('medic')) {
          return { type: 'medic', dots: 1 };
        }
        if (key.includes('observer')) {
          return { type: 'observer', dots: 1 };
        }
        if (key.includes('sniper')) {
          return { type: 'sniper', dots: 1 };
        }
        if (key.includes('flamethrower')) {
          return { type: 'flamethrower', dots: 1 };
        }
        if (key.includes('heavy weapon')) {
          if (uName.includes('machine gun') || uName.includes('mmg') || uName.includes('hmg')) {
            return { type: 'mg', dots: 1 };
          }
          return { type: 'mortar', dots: 1 };
        }
        if (key.includes('machine gun')) {
          return { type: 'mg', dots: 1 };
        }
        if (key.includes('mortar')) {
          return { type: 'mortar', dots: 1 };
        }
        if (key.includes('anti-tank') || key.includes('anti tank')) {
          return { type: 'anti_tank', dots: 1 };
        }
        if (key.includes('artillery') || key.includes('gun')) {
          return { type: 'artillery', dots: slot?.mandatory ? 2 : 1 };
        }
        if (key.includes('transport') || key.includes('tow')) {
          return { type: 'transport', dots: 1 };
        }
        if (key.includes('vehicle') || key.includes('tank') || key.includes('armoured')) {
          return { type: 'armoured', dots: 1 };
        }
        return { type: 'infantry', dots: 1 };
      }

      function UnitTacticalIcon({ slot, unitName, platoonTypeId, className = "w-8 h-6 text-amber-300 shrink-0" }) {
        const { type, dots } = resolveTacticalIconType(slot, unitName, platoonTypeId);
        return (

            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            className={className}
            aria-hidden="true"

            {dots === 1 && <circle cx="18" cy="2.4" r="1.45" fill="currentColor" />}
            {dots === 2 && (
              <>
                <circle cx="15" cy="2.4" r="1.45" fill="currentColor" />
                <circle cx="21" cy="2.4" r="1.45" fill="currentColor" />

            )}
            {dots === 3 && (
              <>
                <circle cx="12.5" cy="2.4" r="1.45" fill="currentColor" />
                <circle cx="18" cy="2.4" r="1.45" fill="currentColor" />

            {/* Outer Tactical Rectangle Frame */}
            <rect x="2" y="6" width="32" height="20" rx="0.5" fill="none" stroke="currentColor" strokeWidth="1.7" />

            {/* Interior Tactical Symbol */}
            {type === 'hq' && (

            {type === 'infantry' && (

                <line x1="34" y1="6" x2="2" y2="26" stroke="currentColor" strokeWidth="1.6" />

            )}

            {type === 'medic' && (
              <>
                <line x1="18" y1="6" x2="18" y2="26" stroke="currentColor" strokeWidth="1.5" />
